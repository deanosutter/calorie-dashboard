<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calorie & Workout Tracker</title>
<style>:root{--ink:#161616;--muted:#6b6b68;--line:#e5e5e0;--paper:#fff;--blue:#2878d4;--purple:#9253c9;--orange:#ef9b35;--green:#48a868;--red:#c62828}*{box-sizing:border-box}body{margin:0;background:#f7f7f4;color:var(--ink);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1120px;margin:auto;padding:28px 20px 60px}header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px}h1{font-size:22px;margin:0}.muted,.sub{color:var(--muted)}.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow:auto}.tab{border:0;background:none;padding:10px 0;color:var(--muted);font:inherit;cursor:pointer;border-bottom:2px solid transparent}.tab.active{color:var(--blue);border-color:var(--blue)}.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}.panel{display:none}.panel.active{display:block}.daybar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.daybar button,.daybar input{border:1px solid var(--line);background:white;border-radius:7px;padding:8px 11px;font:inherit}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.stat{border-right:1px solid var(--line);padding-right:12px}.stat:last-child{border:0}.eyebrow{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.big{font-size:30px;font-weight:700}.burn{color:var(--purple)}.net{color:var(--red)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.section-title{font-size:16px;font-weight:650;margin:0 0 4px}.section-sub{color:var(--muted);font-size:12px;margin:0 0 14px}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--muted);font-size:12px;font-weight:500;padding:8px 7px;border-bottom:1px solid var(--line)}td{padding:10px 7px;border-bottom:1px solid var(--line);vertical-align:top}td.num,th.num{text-align:right;white-space:nowrap}.ref-row{padding:13px 0;border-bottom:1px solid var(--line)}.ref-row strong{display:block;margin-bottom:4px}.macro{color:var(--muted);font-size:12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal{min-height:88px;border:1px solid var(--line);border-radius:8px;padding:7px;background:#fff;cursor:pointer}.cal:hover{border-color:var(--blue)}.cal .n{text-align:right;font-weight:650}.cal .v{font-size:10px;color:var(--muted);margin-top:12px;line-height:1.5}.empty{color:var(--muted);padding:18px 0}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--muted);font-size:11px}.badge.v4{color:var(--green)}.donut-wrap{display:flex;align-items:center;gap:24px;min-height:170px}.donut{width:145px;height:145px;border-radius:50%;position:relative;flex:0 0 auto}.donut:after{content:'';position:absolute;inset:38px;background:#fff;border-radius:50%}.legend{line-height:2}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--blue)}.dot.carb{background:var(--orange)}.dot.fat{background:var(--green)}@media(max-width:760px){.wrap{padding:18px 12px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stat{border:0}.calendar{gap:3px}.cal{min-height:72px;padding:4px}}</style></head>
<body><main class="wrap"><header><h1>Calorie &amp; Workout Tracker</h1><span id="status" class="badge">Loading…</span></header><nav class="tabs"><button class="tab active" data-tab="day">Day</button><button class="tab" data-tab="week">Week</button><button class="tab" data-tab="month">Month</button><button class="tab" data-tab="food">Food Library</button><button class="tab" data-tab="exercise">Exercise</button></nav><div id="day" class="panel active"></div><div id="week" class="panel"></div><div id="month" class="panel"></div><div id="food" class="panel"></div><div id="exercise" class="panel"></div></main>
<script>
let L={},M={dates:[]},V={},selected=centralToday();const $=s=>document.querySelector(s),esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};
function centralToday(){const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).reduce((o,x)=>(o[x.type]=x.value,o),{});return p.year+'-'+p.month+'-'+p.day}
function addDays(d,n){const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}
function legacyDay(d){return {date:d,food_entries:(L.food_entries||[]).filter(x=>x.date===d),workout_entries:(L.workout_entries||[]).filter(x=>x.date===d),daily_active_calories:(L.daily_active_calories||[]).find(x=>x.date===d)||null,weight_entries:(L.weight_entries||[]).filter(x=>x.date===d)}}
function day(d){const a=legacyDay(d),b=V[d];if(!b)return a;return {date:d,food_entries:[...(a.food_entries||[]),...(b.food_entries||[])],workout_entries:[...(a.workout_entries||[]),...(b.workout_entries||[])],daily_active_calories:b.daily_active_calories||a.daily_active_calories,weight_entries:[...(a.weight_entries||[]),...(b.weight_entries||[])]}}
function foods(d){return day(d).food_entries||[]}function cal(d){return foods(d).reduce((s,x)=>s+Number(x.calories||0),0)}function macro(d,k){return foods(d).reduce((s,x)=>s+Number(x[k]||0),0)}function burn(d){const x=day(d).daily_active_calories;return Number(x?.calories||x||0)}function net(d){return cal(d)-burn(d)}function num(n){return Math.round(n||0).toLocaleString()}
function latestWeight(){const a=[...(L.weight_entries||[])];Object.values(V).forEach(d=>a.push(...(d.weight_entries||[]).map(x=>({...x,date:x.date||d.date}))));return a.sort((x,y)=>(x.date||'').localeCompare(y.date||'')).at(-1)}
function workoutHtml(d){const a=day(d).workout_entries||[];return a.length?a.map(w=>'<div class="ref-row"><strong>'+esc(w.routine||'Workout')+'</strong><span class="macro">'+esc(w.duration||'')+'</span><div>'+esc(w.notes||'')+'</div></div>').join(''):'<div class="empty">No workout recorded.</div>'}
function foodHtml(d){const a=foods(d);return a.length?'<table><thead><tr><th>Item</th><th>Meal</th><th class="num">Cal</th><th class="num">P</th><th class="num">C</th><th class="num">F</th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+esc(x.item)+'</td><td>'+esc(x.meal||'')+'</td><td class="num">'+num(x.calories)+'</td><td class="num">'+num(x.protein_g)+'g</td><td class="num">'+num(x.carbs_g)+'g</td><td class="num">'+num(x.fat_g)+'g</td></tr>').join('')+'</tbody></table>':'<div class="empty">No food recorded.</div>'}
function renderDay(){const c=cal(selected),b=burn(selected),n=net(selected),p=macro(selected,'protein_g'),car=macro(selected,'carbs_g'),fat=macro(selected,'fat_g'),goal=L.settings?.daily_calorie_goal||1500,w=latestWeight(),src=V[selected]?'<span class="badge v4">v4 daily file</span>':'<span class="badge">legacy history</span>',kcal=[p*4,car*4,fat*9],total=kcal.reduce((a,b)=>a+b,0)||1,pa=Math.round(kcal[0]/total*100),pb=Math.round((kcal[0]+kcal[1])/total*100);$('#day').innerHTML='<div class="daybar"><button onclick="selected=addDays(selected,-1);renderAll()">Previous</button><div><div class="eyebrow">Selected day</div><input type="date" value="'+selected+'" onchange="selected=this.value;renderAll()"> '+src+'</div><button onclick="selected=addDays(selected,1);renderAll()">Next</button></div><section class="card"><div class="stats"><div class="stat"><div class="eyebrow">Calories eaten</div><div class="big">'+num(c)+'</div><div class="sub">'+num(goal-c)+' remaining</div></div><div class="stat"><div class="eyebrow">Active Burn</div><div class="big burn">'+(b?num(b):'-')+'</div></div><div class="stat"><div class="eyebrow">Net Calories</div><div class="big net">'+num(n)+'</div></div><div class="stat"><div class="eyebrow">Macros</div><div class="big">'+num(p)+'g P</div><div class="sub">C '+num(car)+'g · F '+num(fat)+'g'+(w?' · '+w.weight+' '+(w.unit||'lb'):'')+'</div></div></div></section><div class="grid"><section class="card"><h2 class="section-title">Macro breakdown</h2><p class="section-sub">Calories by macro for this day.</p><div class="donut-wrap"><div class="donut" style="background:conic-gradient(var(--blue) 0 '+pa+'%,var(--orange) '+pa+'% '+pb+'%,var(--green) '+pb+'% 100%)"></div><div class="legend"><div><i class="dot"></i>Protein: '+num(p)+'g</div><div><i class="dot carb"></i>Carbs: '+num(car)+'g</div><div><i class="dot fat"></i>Fat: '+num(fat)+'g</div></div></div></section><section class="card"><h2 class="section-title">Workout</h2><p class="section-sub">'+fmt(selected)+'</p>'+workoutHtml(selected)+'</section></div><section class="card"><h2 class="section-title">Food</h2><p class="section-sub">'+fmt(selected)+'</p>'+foodHtml(selected)+'</section>'}
function weekDays(){const x=new Date(selected+'T12:00:00'),s=new Date(x);s.setDate(x.getDate()-((x.getDay()+6)%7));return Array.from({length:7},(_,i)=>{const z=new Date(s);z.setDate(s.getDate()+i);return z.toISOString().slice(0,10)})}
function renderWeek(){const ds=weekDays();$('#week').innerHTML='<section class="card"><h2 class="section-title">Week</h2><table><thead><tr><th>Day</th><th class="num">Eaten</th><th class="num">Burn</th><th class="num">Net</th><th>Macros</th></tr></thead><tbody>'+ds.map(d=>'<tr onclick="selected=\''+d+'\';show(\'day\')" style="cursor:pointer"><td>'+fmt(d)+'</td><td class="num">'+num(cal(d))+'</td><td class="num">'+(burn(d)?num(burn(d)):'-')+'</td><td class="num">'+num(net(d))+'</td><td>P '+num(macro(d,'protein_g'))+'g · C '+num(macro(d,'carbs_g'))+'g · F '+num(macro(d,'fat_g'))+'g</td></tr>').join('')+'</tbody></table></section>'}
function renderMonth(){const x=new Date(selected+'T12:00:00'),y=x.getFullYear(),m=x.getMonth(),days=new Date(y,m+1,0).getDate(),start=(new Date(y,m,1).getDay()+6)%7;let cells=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>'<div class="eyebrow" style="text-align:center">'+x+'</div>').join('');for(let i=0;i<start;i++)cells+='<div></div>';for(let n=1;n<=days;n++){const d=y+'-'+String(m+1).padStart(2,'0')+'-'+String(n).padStart(2,'0');cells+='<div class="cal" onclick="selected=\''+d+'\';show(\'day\')"><div class="n">'+n+'</div><div class="v">Eat '+num(cal(d))+'<br>Burn '+(burn(d)?num(burn(d)):'-')+'<br>Net '+num(net(d))+'</div></div>'}$('#month').innerHTML='<section class="card"><h2 class="section-title">'+x.toLocaleDateString(undefined,{month:'long',year:'numeric'})+'</h2><p class="section-sub">Click a day to open it.</p><div class="calendar">'+cells+'</div></section>'}
function renderFood(){const a=[...(L.food_items||[]),...(L.recipes||[]),...(L.meals||[])];$('#food').innerHTML='<section class="card"><h2 class="section-title">Food reference library</h2>'+(a.length?'<table><thead><tr><th>Name</th><th>Serving</th><th class="num">Calories</th><th class="num">Protein</th></tr></thead><tbody>'+a.map(x=>'<tr><td><strong>'+esc(x.name)+'</strong><br><span class="macro">'+esc(x.notes||'')+'</span></td><td>'+esc(x.unit||'serving')+'</td><td class="num">'+num(x.calories_per_unit??x.calories)+'</td><td class="num">'+num(x.protein_g_per_unit??x.protein_g)+'g</td></tr>').join('')+'</tbody></table>':'<div class="empty">No references.</div>')+'</section>'}
function renderExercise(){const r=L.routines||[],all=[...(L.workout_entries||[])];Object.values(V).forEach(d=>all.push(...(d.workout_entries||[]).map(x=>({...x,date:x.date||d.date}))));$('#exercise').innerHTML='<div class="grid"><section class="card"><h2 class="section-title">Routines</h2>'+r.map(x=>'<div class="ref-row"><strong>'+esc(x.name)+'</strong><span class="macro">'+esc(x.kind||'')+'</span><div>'+esc(x.notes||'')+'</div></div>').join('')+'</section><section class="card"><h2 class="section-title">Workout history</h2>'+all.sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>'<div class="ref-row"><strong>'+esc(x.date||'')+' · '+esc(x.routine||'Workout')+'</strong><div>'+esc(x.notes||'')+'</div></div>').join('')+'</section></div>'}
function renderAll(){renderDay();renderWeek();renderMonth();renderFood();renderExercise()}function show(t){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));$('#'+t).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));renderAll()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.tab));
async function load(){try{const [legacy,manifest]=await Promise.all([fetch('data.json?x='+Date.now(),{cache:'no-store'}).then(r=>r.json()),fetch('data/manifest.json?x='+Date.now(),{cache:'no-store'}).then(r=>r.json())]);L=legacy;M=manifest;const pairs=await Promise.all((M.dates||[]).map(async d=>[d,await fetch('data/daily/'+d+'.json?x='+Date.now(),{cache:'no-store'}).then(r=>r.json())]));V=Object.fromEntries(pairs);$('#status').textContent='v4 · '+pairs.length+' daily file'+(pairs.length===1?'':'s');$('#status').classList.add('v4');renderAll()}catch(e){$('#status').textContent='Data unavailable';$('#day').innerHTML='<section class="card">Reload in a moment.</section>'}}load();
</script></body></html>
