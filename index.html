<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calorie & Workout Tracker</title>
<style>
:root{--ink:#161616;--muted:#6b6b68;--line:#e5e5e0;--paper:#fff;--blue:#2878d4;--purple:#9253c9;--orange:#ef9b35;--green:#48a868;--red:#c62828}*{box-sizing:border-box}body{margin:0;background:#f7f7f4;color:var(--ink);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1120px;margin:auto;padding:28px 20px 60px}header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px}h1{font-size:22px;margin:0}.date-label,.muted,.sub{color:var(--muted)}.tabs,.subtabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:20px}.tab,.subtab{border:0;background:none;padding:10px 0;color:var(--muted);font:inherit;cursor:pointer;border-bottom:2px solid transparent}.tab.active,.subtab.active{color:var(--blue);border-color:var(--blue)}.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}.panel{display:none}.panel.active{display:block}.daybar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.daybar button,.daybar input{border:1px solid var(--line);background:white;border-radius:7px;padding:8px 11px;font:inherit}.eyebrow{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.big{font-size:32px;font-weight:650}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.stat{border-right:1px solid var(--line);padding-right:12px;min-width:0}.stat:last-child{border:0}.burn{font-size:27px;font-weight:650;color:var(--purple)}.net{font-size:32px;font-weight:800;color:var(--red)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.section-title{font-size:16px;font-weight:650;margin:0 0 4px}.section-sub{color:var(--muted);font-size:12px;margin:0 0 14px}.donut-wrap{display:flex;align-items:center;gap:24px;min-height:170px}.donut{width:145px;height:145px;border-radius:50%;position:relative}.donut:after{content:'';position:absolute;inset:38px;background:#fff;border-radius:50%}.legend{line-height:2}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--blue)}.dot.carb{background:var(--orange)}.dot.fat{background:var(--green)}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--muted);font-size:12px;font-weight:500;padding:8px 7px;border-bottom:1px solid var(--line)}td{padding:10px 7px;border-bottom:1px solid var(--line);vertical-align:top}td.num,th.num{text-align:right;white-space:nowrap}.empty{color:var(--muted);padding:18px 0}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.summary .card{margin:0;padding:14px}.summary .value{font-size:21px;font-weight:650}.ref-row{padding:13px 0;border-bottom:1px solid var(--line)}.ref-row strong{display:block;margin-bottom:3px}.macro-line{color:var(--muted);font-size:12px}.weight-chip{display:inline-flex;align-items:baseline;gap:7px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 11px}.weight-chip strong{font-size:16px}.week-table td{cursor:pointer}.week-table tr:hover td{background:#f9fbff}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal-head{font-size:11px;color:var(--muted);text-align:center;padding:4px}.cal-day{min-height:96px;border:1px solid var(--line);border-radius:8px;padding:7px;cursor:pointer;background:#fff;display:flex;flex-direction:column;justify-content:space-between}.cal-day:hover{border-color:var(--blue)}.cal-day.muted-day{opacity:.35;cursor:default}.cal-day .num{font-weight:650;text-align:right}.cal-bars{height:48px;display:flex;align-items:flex-end;justify-content:center;gap:4px}.cal-bar{width:13px;border-radius:3px 3px 0 0;min-height:2px;background:var(--blue)}.cal-bar.burn{background:var(--purple)}.cal-bar.net{background:var(--red)}.cal-label{font-size:10px;color:var(--muted);text-align:center}.line-chart{width:100%;height:260px;display:block}.chart-legend{display:flex;flex-wrap:wrap;gap:14px;color:var(--muted);font-size:12px;margin-top:10px}.legend-key{display:inline-block;width:12px;height:3px;margin-right:5px;vertical-align:middle}.meal-group{margin:14px 0 18px}.meal-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--line);padding-bottom:7px}.meal-head h3{margin:0;font-size:15px}.meal-total{color:var(--muted);font-size:12px}.exercise-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.routine-card{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff}.routine-card h3{margin:0 0 5px;font-size:15px}.routine-card .kind{color:var(--purple);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.workout-calendar .cal-workout{font-size:11px;color:var(--purple);margin-top:7px;line-height:1.25}.meal-table td:first-child{width:45%}@media(max-width:760px){.wrap{padding:18px 12px}.grid{grid-template-columns:1fr}.stats,.summary{grid-template-columns:1fr 1fr}.stat{border:0}.daybar{align-items:stretch}.daybar button{padding:7px 6px}.week-scroll{overflow-x:auto}.week-table{min-width:640px}.calendar{gap:3px}.cal-day{min-height:78px;padding:4px}.cal-bars{height:34px}.cal-bar{width:9px}.cal-label{display:none}.workout-calendar .cal-workout{font-size:9px}}
</style>
</head>
<body><main class="wrap" id="app"><header><h1>Calorie &amp; Workout Tracker</h1><span class="date-label" id="today"></span></header><nav class="tabs"><button class="tab active" data-tab="dashboard">Dashboard</button><button class="tab" data-tab="week">Week</button><button class="tab" data-tab="month">Month</button><button class="tab" data-tab="food">Food</button><button class="tab" data-tab="exercise">Exercise</button></nav><div id="dashboard" class="panel active"></div><div id="week" class="panel"></div><div id="month" class="panel"></div><div id="food" class="panel"></div><div id="exercise" class="panel"></div></main>
<script>
let D={};const today=(()=>{const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).reduce((o,x)=>(o[x.type]=x.value,o),{});return p.year+'-'+p.month+'-'+p.day})();let selected=today;const $=s=>document.querySelector(s),esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};const rows=d=>(D.food_entries||[]).filter(x=>x.date===d),cal=d=>rows(d).reduce((a,x)=>a+Number(x.calories||0),0),macro=(d,k)=>rows(d).reduce((a,x)=>a+Number(x[k]||0),0),activeBurn=d=>(D.daily_active_calories||[]).find(x=>x.date===d)?.calories||0,netCal=d=>cal(d)-activeBurn(d),fmt=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'}),shortFmt=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'numeric',day:'numeric'}),avg=a=>Math.round(a.reduce((x,y)=>x+y,0)/(a.length||1)),num=n=>Math.round(n||0).toLocaleString();
function addDays(d,n){const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function weekDays(){const base=new Date(selected+'T12:00:00'),start=new Date(base);start.setDate(base.getDate()-((base.getDay()+6)%7));return Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d.toISOString().slice(0,10)})}
function monthDays(){const base=new Date(selected+'T12:00:00'),y=base.getFullYear(),m=base.getMonth(),daysIn=new Date(y,m+1,0).getDate();return Array.from({length:daysIn},(_,i)=>y+'-'+String(m+1).padStart(2,'0')+'-'+String(i+1).padStart(2,'0'))}
function latestWeight(){return (D.weight_entries||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).at(-1)||null}
function lastWeightForMonth(y,m){return (D.weight_entries||[]).filter(x=>{const d=new Date((x.date||'')+'T12:00:00');return d.getFullYear()===y&&d.getMonth()===m}).sort((a,b)=>(a.date||'').localeCompare(b.date||'')).at(-1)||null}
function macroCells(d){return '<span class="macro-line">P '+Math.round(macro(d,'protein_g'))+'g · C '+Math.round(macro(d,'carbs_g'))+'g · F '+Math.round(macro(d,'fat_g'))+'g</span>'}
function weightChip(){const w=latestWeight();return w?'<div class="weight-chip"><span class="eyebrow">Latest weight</span><strong>'+esc(w.weight)+' '+esc(w.unit||'lb')+'</strong><span class="muted">'+esc(w.date)+'</span></div>':'<div class="weight-chip"><span class="eyebrow">Latest weight</span><span class="muted">No weight logged</span></div>'}
function workoutHtml(d){const ws=(D.workout_entries||[]).filter(x=>x.date===d);return ws.length?ws.map(w=>{const kcal=w.calories_burned??w.total_energy_kcal??w.active_calories;const kcalText=kcal!=null?Math.round(kcal)+' kcal burned':'Calories: Apple Health workout detail not synced';return '<div class="ref-row"><strong>'+esc(w.routine)+'</strong><span class="macro-line">'+esc(kcalText)+'</span><br><span class="macro-line">'+esc(w.notes||'')+'</span></div>'}).join(''):'<div class="empty">No workout recorded for this day.</div>'}
function dashboard(){const c=cal(selected),ab=activeBurn(selected),n=netCal(selected),p=macro(selected,'protein_g'),car=macro(selected,'carbs_g'),fat=macro(selected,'fat_g'),g=D.settings.daily_calorie_goal||0,es=rows(selected);const kcal=[p*4,car*4,fat*9],total=kcal.reduce((a,b)=>a+b,0)||1;const pa=Math.round(kcal[0]/total*100),pb=Math.round((kcal[0]+kcal[1])/total*100);const groups=['Breakfast','Lunch','Dinner','Snacks','Dessert'];const food=groups.map(m=>{const a=es.filter(e=>(e.meal||'Snacks')===m);if(!a.length)return '';return '<div class="meal-group"><div class="meal-head"><h3>'+m+'</h3><span class="meal-total">'+a.reduce((t,e)=>t+Number(e.calories||0),0).toLocaleString()+' kcal</span></div><table class="meal-table"><thead><tr><th>Item</th><th>Qty</th><th class="num">Cal</th><th class="num">P</th><th class="num">C</th><th class="num">F</th></tr></thead><tbody>'+a.map(e=>'<tr><td>'+esc(e.item)+'</td><td>'+esc((e.quantity??'')+' '+(e.unit||''))+'</td><td class="num">'+Math.round(e.calories||0)+'</td><td class="num">'+(e.protein_g!=null?Math.round(e.protein_g)+'g':'-')+'</td><td class="num">'+(e.carbs_g!=null?Math.round(e.carbs_g)+'g':'-')+'</td><td class="num">'+(e.fat_g!=null?Math.round(e.fat_g)+'g':'-')+'</td></tr>').join('')+'</tbody></table></div>'}).join('');return '<div class="daybar"><button onclick="move(-1)">Previous</button><div><div class="eyebrow">Selected day</div><input type="date" value="'+selected+'" onchange="selected=this.value;render()"></div>'+weightChip()+'<button onclick="move(1)">Next</button></div><div class="card"><div class="stats"><div class="stat"><div class="eyebrow">Calories eaten</div><div class="big">'+num(c)+'</div><div class="sub">'+(g?g.toLocaleString()+' goal · '+(g-c).toLocaleString()+' remaining':'')+'</div></div><div class="stat"><div class="eyebrow">Active Burn</div><div class="burn">'+(ab?ab.toLocaleString():'-')+' kcal</div><div class="sub">'+(ab?'Apple Health Active Energy':'No active-calorie sync recorded')+'</div></div><div class="stat"><div class="eyebrow">Net Calories</div><div class="net">'+num(n)+'</div><div class="sub">Calories eaten minus Active Burn</div></div><div class="stat"><div class="eyebrow">Macros</div><div class="big">'+Math.round(p)+'g P</div><div class="sub">C '+Math.round(car)+'g · F '+Math.round(fat)+'g</div></div></div></div><div class="grid"><section class="card"><h2 class="section-title">Macro breakdown</h2><p class="section-sub">Calories by macro for this day.</p><div class="donut-wrap"><div class="donut" style="background:conic-gradient(var(--blue) 0 '+pa+'%,var(--orange) '+pa+'% '+pb+'%,var(--green) '+pb+'% 100%)"></div><div class="legend"><div><i class="dot"></i>Protein: '+Math.round(p)+'g</div><div><i class="dot carb"></i>Carbs: '+Math.round(car)+'g</div><div><i class="dot fat"></i>Fat: '+Math.round(fat)+'g</div></div></div></section><section class="card"><h2 class="section-title">Workout</h2><p class="section-sub">Recorded exercises for this day.</p>'+workoutHtml(selected)+'</section></div><section class="card"><h2 class="section-title">Food entries · '+fmt(selected)+'</h2><p class="section-sub">Grouped by meal. Unclassified items go to Snacks.</p>'+ (food || '<div class="empty">No food entries recorded for this day.</div>') +'</section>'}
function week(){const ds=weekDays(),recorded=ds.filter(d=>cal(d)||activeBurn(d));return '<div class="summary"><div class="card"><div class="eyebrow">Avg intake</div><div class="value">'+avg(recorded.map(cal)).toLocaleString()+' kcal</div></div><div class="card"><div class="eyebrow">Avg Active Burn</div><div class="value">'+avg(recorded.map(activeBurn)).toLocaleString()+' kcal</div></div><div class="card"><div class="eyebrow">Avg Net Calories</div><div class="value">'+avg(recorded.map(netCal)).toLocaleString()+' kcal</div></div><div class="card"><div class="eyebrow">Days recorded</div><div class="value">'+recorded.length+'</div></div></div><section class="card"><h2 class="section-title">Recorded days</h2><p class="section-sub">Click any table square to open that day.</p><div class="week-scroll"><table class="week-table"><thead><tr><th>Recorded days</th><th class="num">Calories eaten</th><th class="num">Calories Burned</th><th class="num">Net Calories</th><th>Macros</th></tr></thead><tbody>'+ds.map(d=>'<tr onclick="selected=\''+d+'\';show(\'dashboard\')"><td><strong>'+shortFmt(d)+'</strong></td><td class="num">'+num(cal(d))+'</td><td class="num">'+(activeBurn(d)?num(activeBurn(d)):'-')+'</td><td class="num"><strong style="color:var(--red)">'+num(netCal(d))+'</strong></td><td>'+macroCells(d)+'</td></tr>').join('')+'</tbody></table></div></section>'}
function month(){const ds=monthDays(),base=new Date(selected+'T12:00:00'),y=base.getFullYear(),m=base.getMonth(),title=base.toLocaleDateString(undefined,{month:'long',year:'numeric'}),start=(new Date(y,m,1).getDay()+6)%7,mx=Math.max(1,...ds.flatMap(d=>[cal(d),activeBurn(d),Math.abs(netCal(d))]));let cells=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>'<div class="cal-head">'+x+'</div>').join('');for(let i=0;i<start;i++)cells+='<div class="cal-day muted-day"></div>';cells+=ds.map(d=>'<div class="cal-day" onclick="selected=\''+d+'\';show(\'dashboard\')"><div class="num">'+Number(d.slice(-2))+'</div><div class="cal-bars"><div class="cal-bar" title="Calories eaten" style="height:'+(cal(d)/mx*100)+'%"></div><div class="cal-bar burn" title="Active Burn" style="height:'+(activeBurn(d)/mx*100)+'%"></div><div class="cal-bar net" title="Net Calories" style="height:'+(Math.abs(netCal(d))/mx*100)+'%"></div></div><div class="cal-label">'+num(cal(d))+' / '+num(activeBurn(d))+' / '+num(netCal(d))+'</div></div>').join('');return '<section class="card"><h2 class="section-title">'+title+'</h2><p class="section-sub">Blue = calories eaten · purple = Active Burn · red = Net Calories. Click any day to open it.</p><div class="calendar">'+cells+'</div></section><section class="card"><h2 class="section-title">'+y+' monthly averages</h2>'+yearLineChart(y)+'</section>'}
function line(points,color,max){const w=1000,h=220,pad=28,step=(w-pad*2)/11;return points.map((v,i)=>v==null?null:[pad+i*step,h-pad-(v/max)*(h-pad*2)]).map((pt,i,a)=>pt?((a.slice(0,i).reverse().find(Boolean)?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)):null).filter(Boolean).join(' ')}
function circles(points,color,max){const w=1000,h=220,pad=28,step=(w-pad*2)/11;return points.map((v,i)=>v==null?'':'<circle cx="'+(pad+i*step).toFixed(1)+'" cy="'+(h-pad-(v/max)*(h-pad*2)).toFixed(1)+'" r="3" fill="'+color+'"></circle>').join('')}
function yearLineChart(y){const months=Array.from({length:12},(_,m)=>{const prefix=y+'-'+String(m+1).padStart(2,'0')+'-',ds=Array.from(new Set([...(D.food_entries||[]).map(x=>x.date),...(D.daily_active_calories||[]).map(x=>x.date)])).filter(d=>d&&d.startsWith(prefix));const recorded=ds.filter(d=>cal(d)||activeBurn(d)),w=lastWeightForMonth(y,m);return {eat:recorded.length?avg(recorded.map(cal)):null,burn:recorded.length?avg(recorded.map(activeBurn)):null,net:recorded.length?avg(recorded.map(netCal)):null,weight:w?Number(w.weight):null}}),calMax=Math.max(1,...months.flatMap(x=>[x.eat||0,x.burn||0,Math.abs(x.net||0)])),weightMax=Math.max(1,...months.map(x=>x.weight||0));const weightScaled=months.map(x=>x.weight==null?null:(x.weight/weightMax)*calMax),labels=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return '<svg class="line-chart" viewBox="0 0 1000 260" role="img" aria-label="Monthly averages for '+y+'"><line x1="28" y1="192" x2="972" y2="192" stroke="var(--line)"/><path d="'+line(months.map(x=>x.eat),'var(--blue)',calMax)+'" fill="none" stroke="var(--blue)" stroke-width="4"/>'+circles(months.map(x=>x.eat),'var(--blue)',calMax)+'<path d="'+line(months.map(x=>x.burn),'var(--purple)',calMax)+'" fill="none" stroke="var(--purple)" stroke-width="4"/>'+circles(months.map(x=>x.burn),'var(--purple)',calMax)+'<path d="'+line(months.map(x=>Math.abs(x.net)),'var(--red)',calMax)+'" fill="none" stroke="var(--red)" stroke-width="4"/>'+circles(months.map(x=>Math.abs(x.net)),'var(--red)',calMax)+'<path d="'+line(weightScaled,'var(--green)',calMax)+'" fill="none" stroke="var(--green)" stroke-width="4"/>'+circles(weightScaled,'var(--green)',calMax)+labels.map((l,i)=>'<text x="'+(28+i*((1000-56)/11)).toFixed(1)+'" y="235" text-anchor="middle" fill="var(--muted)" font-size="12">'+l+'</text>').join('')+'</svg><div class="chart-legend"><span><i class="legend-key" style="background:var(--blue)"></i>Avg calories eaten</span><span><i class="legend-key" style="background:var(--purple)"></i>Avg Active Burn</span><span><i class="legend-key" style="background:var(--red)"></i>Avg net Calories</span><span><i class="legend-key" style="background:var(--green)"></i>Last recorded weight</span></div>'}
function exercise(){return '<section class="card"><h2 class="section-title">Exercise library</h2><p class="section-sub">Your reusable routines and completed workout calendar.</p><nav class="subtabs"><button class="subtab active" data-ex="routines">Routines</button><button class="subtab" data-ex="calendar">Workout calendar</button></nav><div id="exercise-ref"></div></section>'}
function routinesHtml(){const a=D.routines||[];return a.length?'<div class="exercise-grid">'+a.map(x=>'<article class="routine-card"><div class="kind">'+esc(x.kind||'exercise')+'</div><h3>'+esc(x.name||'')+'</h3><div class="macro-line">'+esc(x.notes||'')+'</div></article>').join('')+'</div>':'<div class="empty">No saved routines yet.</div>'}
function historyHtml(){const base=new Date(selected+'T12:00:00'),y=base.getFullYear(),m=base.getMonth(),first=new Date(y,m,1),daysIn=new Date(y,m+1,0).getDate(),start=(first.getDay()+6)%7,labels=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];let cells=labels.map(x=>'<div class="cal-head">'+x+'</div>').join('');for(let i=0;i<start;i++)cells+='<div class="cal-day muted-day"></div>';for(let n=1;n<=daysIn;n++){const d=y+'-'+String(m+1).padStart(2,'0')+'-'+String(n).padStart(2,'0'),ws=(D.workout_entries||[]).filter(x=>x.date===d);cells+='<div class="cal-day" onclick="selected=\''+d+'\';show(\'dashboard\')"><div class="num">'+n+'</div>'+(ws.length?'<div class="cal-workout">'+ws.map(x=>esc(x.routine||'Workout')).join('<br>')+'</div>':'')+'</div>'}return '<div class="calendar workout-calendar">'+cells+'</div>'}
function renderExerciseRef(kind){const el=$('#exercise-ref');if(!el)return;if(kind==='routines'){el.innerHTML=routinesHtml();return}el.innerHTML='<h3 class="section-title">Workout calendar</h3><p class="section-sub">Click any workout date to open that day on the Dashboard.</p>'+historyHtml()}
function bindExercise(){document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-ex]').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderExerciseRef(b.dataset.ex)});renderExerciseRef('routines')}
function food(){const sub='<nav class="subtabs"><button class="subtab active" data-ref="food_items">Foods</button><button class="subtab" data-ref="recipes">Recipes</button><button class="subtab" data-ref="meals">Meals</button></nav><div id="refs"></div>';setTimeout(()=>{document.querySelectorAll('.subtab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.subtab').forEach(x=>x.classList.remove('active'));b.classList.add('active');refs(b.dataset.ref)});refs('food_items')},0);return '<section class="card"><h2 class="section-title">Food reference library</h2><p class="section-sub">Foods are ingredients/products. Recipes are prepared dishes. Meals are repeatable combinations.</p>'+sub+'</section>'}
function refs(kind){const a=D[kind]||[];$('#refs').innerHTML=a.length?'<table><thead><tr><th>Name</th><th>Serving</th><th class="num">Calories</th><th class="num">Protein</th><th class="num">Carbs</th><th class="num">Fat</th></tr></thead><tbody>'+a.map(x=>{const unit=x.unit||'serving',c=x.calories_per_unit??x.calories??0,p=x.protein_g_per_unit??x.protein_g??0;return '<tr><td><strong>'+esc(x.name)+'</strong><br><span class="macro-line">'+esc(x.notes||'')+'</span></td><td>'+esc(unit)+'</td><td class="num">'+Math.round(c)+'</td><td class="num">'+Math.round(p)+'g</td><td class="num">'+(x.carbs_g_per_unit??x.carbs_g??'-')+(x.carbs_g_per_unit!=null||x.carbs_g!=null?'g':'')+'</td><td class="num">'+(x.fat_g_per_unit??x.fat_g??'-')+(x.fat_g_per_unit!=null||x.fat_g!=null?'g':'')+'</td></tr>'}).join('')+'</tbody></table>':'<div class="empty">No saved '+kind.replace('_',' ')+' yet.</div>'}
function move(n){selected=addDays(selected,n);render()}function show(t){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));$('#'+t).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));if(t==='food'){$('#food').innerHTML=food()}if(t==='exercise'){$('#exercise').innerHTML=exercise();bindExercise()}}function render(){$('#today').textContent=fmt(today);$('#dashboard').innerHTML=dashboard();$('#week').innerHTML=week();$('#month').innerHTML=month()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.tab));fetch('data.json?live='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(x=>{D=Object.assign({settings:{},food_entries:[],daily_active_calories:[],food_items:[],recipes:[],meals:[],weight_entries:[]},x);render()}).catch(()=>{$('#dashboard').innerHTML='<section class="card"><h2>Tracker data unavailable</h2><p class="muted">Reload in a moment.</p></section>'});
</script></body></html>
