<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calorie & Workout Tracker</title>
<style>
:root{--ink:#161616;--muted:#6b6b68;--line:#e5e5e0;--paper:#fff;--blue:#2878d4;--purple:#9253c9;--green:#138a45}*{box-sizing:border-box}body{margin:0;background:#f7f7f4;color:var(--ink);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:940px;margin:auto;padding:28px 20px 60px}header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px}h1{font-size:20px;margin:0;font-weight:650}.date-label{color:var(--muted)}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:20px}.tab{border:0;background:none;padding:10px 0;color:var(--muted);font:inherit;cursor:pointer;border-bottom:2px solid transparent}.tab.active{color:var(--blue);border-color:var(--blue)}.panel{display:none}.panel.active{display:block}.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}.daybar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.daybar button{border:1px solid var(--line);background:white;border-radius:7px;padding:7px 11px;cursor:pointer}.daybar input{border:1px solid var(--line);border-radius:7px;padding:7px 10px;font:inherit}.eyebrow{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.big{font-size:34px;font-weight:650;line-height:1.1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.stat{border-right:1px solid var(--line);padding-right:12px}.stat:last-child{border:0}.sub{color:var(--muted);font-size:12px;margin-top:3px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.section-title{font-size:15px;font-weight:650;margin:0 0 3px}.section-sub{color:var(--muted);font-size:12px;margin-bottom:14px}.donut-wrap{display:flex;align-items:center;gap:24px;min-height:170px}.donut{width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--blue) 0 20%,#d8d8d2 20% 100%);position:relative}.donut:after{content:'';position:absolute;inset:38px;background:white;border-radius:50%}.legend{font-size:13px;line-height:2}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--blue)}.dot.other{background:#d8d8d2}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--muted);font-size:12px;font-weight:500;padding:7px 6px;border-bottom:1px solid var(--line)}td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}td.num,th.num{text-align:right;white-space:nowrap}.empty{color:var(--muted);padding:18px 0}.burn{font-size:28px;font-weight:650;color:var(--purple)}.watch{color:var(--muted);font-size:12px}.workout{border:1px solid var(--line);border-radius:9px;padding:13px;margin-top:12px}.workout h3{font-size:14px;margin:0 0 4px}.note{color:#444;line-height:1.5;font-size:13px}.history-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}.history-row:hover{background:#fafaf8}.pill{font-size:12px;color:var(--muted)}.chart{height:240px;display:flex;align-items:flex-end;gap:8px;border-bottom:1px solid var(--line);padding:0 4px}.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}.bars{height:190px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}.bar{width:14px;max-width:35%;background:var(--blue);border-radius:4px 4px 0 0}.bar.burn{background:var(--purple)}.xlabel{font-size:11px;color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stat{border:0}.wrap{padding:20px 12px}.donut-wrap{gap:14px}}
</style></head><body><main class="wrap" id="app"></main>
<script>
let D;
function chicagoToday(){const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).reduce((o,x)=>(o[x.type]=x.value,o),{});return p.year+'-'+p.month+'-'+p.day}
const today=chicagoToday();
let selected=today;
const $=s=>document.querySelector(s), esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};
const foodDate=d=>D.food_entries.filter(x=>x.date===d);
const cal=d=>foodDate(d).reduce((a,x)=>a+Number(x.calories||0),0);
const protein=d=>foodDate(d).reduce((a,x)=>a+Number(x.protein_g||0),0);
const burn=d=>(D.daily_active_calories||[]).find(x=>x.date===d)?.calories||0;
const workouts=d=>D.workout_entries.filter(x=>x.date===d);
const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});
function dayView(){const c=cal(selected),p=protein(selected),g=D.settings.daily_calorie_goal||0,pg=D.settings.daily_protein_goal_g||0, entries=foodDate(selected),ws=workouts(selected),bc=burn(selected);const pct=c?Math.min(100,Math.round((p*4/c)*100)):0;
return `<div class="daybar"><button onclick="move(-1)">← Previous</button><div><div class="eyebrow">Selected day</div><input type="date" value="${selected}" onchange="selected=this.value;render()"></div><button onclick="move(1)">Next →</button></div>
<div class="card"><div class="stats"><div class="stat"><div class="eyebrow">Calories eaten</div><div class="big">${c.toLocaleString()}</div><div class="sub">${g?g.toLocaleString()+' goal · '+(g-c).toLocaleString()+' remaining':''}</div></div><div class="stat"><div class="eyebrow">Protein</div><div class="big">${Math.round(p)}g</div><div class="sub">${pg?pg+'g goal':''}</div></div><div class="stat"><div class="eyebrow">Active burn</div><div class="burn">${bc?bc.toLocaleString():'—'} kcal</div><div class="watch">${bc?'Apple Watch synced Active Energy':'No watch sync recorded for this day'}</div></div></div></div>
<div class="grid"><section class="card"><h2 class="section-title">Macro breakdown</h2><p class="section-sub">${pct}% of logged calories are represented by protein; remaining macros are not yet stored by the logger.</p><div class="donut-wrap"><div class="donut" style="background:conic-gradient(var(--blue) 0 ${pct}%,#d8d8d2 ${pct}% 100%)"></div><div class="legend"><div><i class="dot"></i>Protein calories: ${Math.round(p*4).toLocaleString()}</div><div><i class="dot other"></i>Other calories: ${Math.max(0,c-Math.round(p*4)).toLocaleString()}</div></div></div></section>
<section class="card"><h2 class="section-title">Workout</h2><p class="section-sub">Watch burn is the daily total. Workout detail is recorded separately.</p>${ws.length?ws.map(w=>`<div class="workout"><h3>${esc(w.routine||w.activity||'Workout')} <span class="pill">${esc(w.duration||'')}</span></h3><div class="note">${esc(w.notes||'No segment notes recorded.')}</div></div>`).join(''):'<div class="empty">No workout recorded for this day.</div>'}</section></div>
<section class="card"><h2 class="section-title">Food entries · ${fmt(selected)}</h2><p class="section-sub">Every item recorded for the selected day.</p>${entries.length?`<table><thead><tr><th>Time</th><th>Item</th><th>Qty</th><th class="num">Calories</th><th class="num">Protein</th></tr></thead><tbody>${entries.map(e=>`<tr><td>${esc(e.time||'')}</td><td>${esc(e.item)}</td><td>${esc((e.quantity??'')+' '+(e.unit||''))}</td><td class="num">${Math.round(e.calories||0)}</td><td class="num">${e.protein_g!=null?Math.round(e.protein_g)+'g':'—'}</td></tr>`).join('')}</tbody></table>`: '<div class="empty">No food entries recorded for this day.</div>'}</section>`;}
function periodView(mode){
 const days=mode==='month'?30:7, end=new Date(today+'T12:00:00'), ds=[];
 for(let i=days-1;i>=0;i--){const d=new Date(end);d.setDate(end.getDate()-i);ds.push(d.toISOString().slice(0,10))}
 const mx=Math.max(1,...ds.map(d=>Math.max(cal(d),burn(d))),D.settings.daily_calorie_goal||0);
 return `<section class="card"><h2 class="section-title">${mode==='month'?'Month':'Week'} view</h2><p class="section-sub">Blue = calories eaten · purple = Apple Watch Active Energy. Click any day to open its record.</p><div class="chart">${ds.map(d=>`<div class="col" onclick="selected='${d}';show('dashboard')"><div class="bars"><div class="bar" style="height:${cal(d)/mx*100}%"></div><div class="bar burn" style="height:${burn(d)/mx*100}%"></div></div><div class="xlabel">${new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'numeric',day:'numeric'})}</div></div>`).join('')}</div></section><section class="card"><h2 class="section-title">Recorded days</h2>${ds.filter(d=>cal(d)||burn(d)||workouts(d).length).reverse().map(d=>`<div class="history-row" onclick="selected='${d}';show('dashboard')"><span><b>${fmt(d)}</b><br><span class="pill">${cal(d).toLocaleString()} eaten · ${burn(d).toLocaleString()||'—'} active burn</span></span><span>Open →</span></div>`).join('')||'<div class="empty">No recorded days in this window.</div>'}</section>`;
}
function move(n){const d=new Date(selected+'T12:00:00');d.setDate(d.getDate()+n);selected=d.toISOString().slice(0,10);render()}
function show(tab){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.querySelector('#'+tab).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));}
function render(){try{document.querySelector('#dashboard').innerHTML=dayView();document.querySelector('#week').innerHTML=periodView('week');document.querySelector('#month').innerHTML=periodView('month');document.querySelector('#today').textContent=fmt(today)}catch(e){showError(e)}}
document.querySelector('#app').innerHTML='<header><h1>Calorie & Workout Tracker</h1><span class="date-label" id="today"></span></header><nav class="tabs"><button class="tab active" data-tab="dashboard">Dashboard</button><button class="tab" data-tab="week">Week</button><button class="tab" data-tab="month">Month</button></nav><div id="dashboard" class="panel active"></div><div id="week" class="panel"></div><div id="month" class="panel"></div>';document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.tab));
function safeData(x){x=x&&typeof x==='object'?x:{};return Object.assign({settings:{},food_entries:[],daily_active_calories:[],workout_entries:[]},x,{settings:Object.assign({},x.settings||{}),food_entries:Array.isArray(x.food_entries)?x.food_entries:[],daily_active_calories:Array.isArray(x.daily_active_calories)?x.daily_active_calories:[],workout_entries:Array.isArray(x.workout_entries)?x.workout_entries:[]})}function showError(e){document.querySelector('#app').innerHTML='<div class="card"><h2>Dashboard could not load</h2><p class="note">The tracker data is safe. Reload this page in a moment.</p><p class="pill">'+String(e&&e.message||e)+'</p></div>'}window.addEventListener('error',e=>showError(e.error||e.message));fetch('data.json?live='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Data request failed: '+r.status);return r.json()}).then(x=>{D=safeData(x);render()}).catch(e=>{D=safeData({});showError(e);});
</script>
</body>
</html>
