<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calorie & Workout Tracker</title>
<style>
:root{--ink:#161616;--muted:#6b6b68;--line:#e5e5e0;--paper:#fff;--blue:#2878d4;--purple:#9253c9}*{box-sizing:border-box}body{margin:0;background:#f7f7f4;color:var(--ink);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px 20px 60px}header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px}h1{font-size:22px;margin:0}.date-label,.muted,.sub{color:var(--muted)}.tabs,.subtabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:20px}.tab,.subtab{border:0;background:none;padding:10px 0;color:var(--muted);font:inherit;cursor:pointer;border-bottom:2px solid transparent}.tab.active,.subtab.active{color:var(--blue);border-color:var(--blue)}.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}.panel{display:none}.panel.active{display:block}.daybar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.daybar button,.daybar input{border:1px solid var(--line);background:white;border-radius:7px;padding:8px 11px;font:inherit}.eyebrow{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.big{font-size:32px;font-weight:650}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.stat{border-right:1px solid var(--line);padding-right:12px}.stat:last-child{border:0}.burn{font-size:27px;font-weight:650;color:var(--purple)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.section-title{font-size:16px;font-weight:650;margin:0 0 4px}.section-sub{color:var(--muted);font-size:12px;margin:0 0 14px}.donut-wrap{display:flex;align-items:center;gap:24px;min-height:170px}.donut{width:145px;height:145px;border-radius:50%;position:relative}.donut:after{content:'';position:absolute;inset:38px;background:#fff;border-radius:50%}.legend{line-height:2}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--blue)}.dot.carb{background:#ef9b35}.dot.fat{background:#48a868}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--muted);font-size:12px;font-weight:500;padding:7px 6px;border-bottom:1px solid var(--line)}td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}td.num,th.num{text-align:right;white-space:nowrap}.empty{color:var(--muted);padding:18px 0}.history-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}.chart-wrap{overflow:hidden}.chart{height:250px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;align-items:end;border-bottom:1px solid var(--line);padding:0 4px}.chart.month{height:auto;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;border:0;align-items:stretch}.col{min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}.month .col{border:1px solid var(--line);border-radius:7px;padding:7px 3px;min-height:62px;justify-content:space-between}.bars{height:195px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}.month .bars{height:34px}.bar{width:15px;max-width:42%;background:var(--blue);border-radius:3px 3px 0 0;min-height:0}.bar.burn{background:var(--purple)}.xlabel{font-size:11px;color:var(--muted);white-space:nowrap}.month .xlabel{font-size:10px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.summary .card{margin:0;padding:14px}.summary .value{font-size:21px;font-weight:650}.ref-row{padding:13px 0;border-bottom:1px solid var(--line)}.ref-row strong{display:block;margin-bottom:3px}.macro-line{color:var(--muted);font-size:12px}@media(max-width:700px){.wrap{padding:18px 12px}.grid{grid-template-columns:1fr}.stats,.summary{grid-template-columns:1fr 1fr}.stat{border:0}.chart{gap:3px}.xlabel{font-size:9px}.daybar{align-items:stretch}.daybar button{padding:7px 6px}}
 .meal-group{margin:14px 0 18px}.meal-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--line);padding-bottom:7px}.meal-head h3{margin:0;font-size:15px}.meal-total{color:var(--muted);font-size:12px}.exercise-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.routine-card{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff}.routine-card h3{margin:0 0 5px;font-size:15px}.routine-card .kind{color:var(--purple);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal-head{font-size:11px;color:var(--muted);text-align:center;padding:4px}.cal-day{min-height:82px;border:1px solid var(--line);border-radius:8px;padding:7px;cursor:pointer;background:#fff}.cal-day:hover{border-color:var(--blue)}.cal-day.muted-day{opacity:.35}.cal-day .num{font-weight:650}.cal-workout{font-size:11px;color:var(--purple);margin-top:7px;line-height:1.25}.meal-table td:first-child{width:45%}@media(max-width:700px){.calendar{gap:3px}.cal-day{min-height:65px;padding:4px}.cal-workout{font-size:9px}} </style></head><body><main class="wrap" id="app"><header><h1>Calorie &amp; Workout Tracker</h1><span class="date-label" id="today"></span></header><nav class="tabs"><button class="tab active" data-tab="dashboard">Dashboard</button><button class="tab" data-tab="week">Week</button><button class="tab" data-tab="month">Month</button><button class="tab" data-tab="food">Food</button><button class="tab" data-tab="exercise">Exercise</button></nav><div id="dashboard" class="panel active"></div><div id="week" class="panel"></div><div id="month" class="panel"></div><div id="food" class="panel"></div><div id="exercise" class="panel"></div></main>
<script>
let D={};const today=(()=>{const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).reduce((o,x)=>(o[x.type]=x.value,o),{});return p.year+'-'+p.month+'-'+p.day})();let selected=today;const $=s=>document.querySelector(s),esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};const rows=d=>D.food_entries.filter(x=>x.date===d),cal=d=>rows(d).reduce((a,x)=>a+Number(x.calories||0),0),macro=(d,k)=>rows(d).reduce((a,x)=>a+Number(x[k]||0),0),burn=d=>(D.daily_active_calories||[]).find(x=>x.date===d)?.calories||0,fmt=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'}),days=(n)=>{const a=[],e=new Date(today+'T12:00:00');for(let i=n-1;i>=0;i--){const d=new Date(e);d.setDate(e.getDate()-i);a.push(d.toISOString().slice(0,10))}return a},avg=(a)=>Math.round(a.reduce((x,y)=>x+y,0)/(a.length||1));
function macroCells(d){return '<span class="macro-line">P '+Math.round(macro(d,'protein_g'))+'g · C '+Math.round(macro(d,'carbs_g'))+'g · F '+Math.round(macro(d,'fat_g'))+'g</span>'}
function workoutHtml(d){const ws=(D.workout_entries||[]).filter(x=>x.date===d);return ws.length?ws.map(w=>{const kcal=w.calories_burned??w.total_energy_kcal??w.active_calories;const kcalText=kcal!=null?Math.round(kcal)+' kcal burned':'Calories: Apple Health workout detail not synced';return '<div class="ref-row"><strong>'+esc(w.routine)+'</strong><span class="macro-line">'+esc(kcalText)+'</span><br><span class="macro-line">'+esc(w.notes||'')+'</span></div>'}).join(''):'<div class="empty">No workout recorded for this day.</div>'}
function dashboard(){const c=cal(selected),p=macro(selected,'protein_g'),car=macro(selected,'carbs_g'),fat=macro(selected,'fat_g'),g=D.settings.daily_calorie_goal||0,es=rows(selected);const kcal=[p*4,car*4,fat*9],total=kcal.reduce((a,b)=>a+b,0)||1;const pa=Math.round(kcal[0]/total*100),pb=Math.round((kcal[0]+kcal[1])/total*100);const groups=['Breakfast','Lunch','Dinner','Snacks'];const food=groups.map(m=>{const a=es.filter(e=>(e.meal||'Snacks')===m);if(!a.length)return '';return '<div class="meal-group"><div class="meal-head"><h3>'+m+'</h3><span class="meal-total">'+a.reduce((n,e)=>n+Number(e.calories||0),0).toLocaleString()+' kcal</span></div><table class="meal-table"><thead><tr><th>Item</th><th>Qty</th><th class="num">Cal</th><th class="num">P</th><th class="num">C</th><th class="num">F</th></tr></thead><tbody>'+a.map(e=>'<tr><td>'+esc(e.item)+'</td><td>'+esc((e.quantity??'')+' '+(e.unit||''))+'</td><td class="num">'+Math.round(e.calories||0)+'</td><td class="num">'+(e.protein_g!=null?Math.round(e.protein_g)+'g':'—')+'</td><td class="num">'+(e.carbs_g!=null?Math.round(e.carbs_g)+'g':'—')+'</td><td class="num">'+(e.fat_g!=null?Math.round(e.fat_g)+'g':'—')+'</td></tr>').join('')+'</tbody></table></div>'}).join('');return '<div class="daybar"><button onclick="move(-1)">← Previous</button><div><div class="eyebrow">Selected day</div><input type="date" value="'+selected+'" onchange="selected=this.value;render()"></div><button onclick="move(1)">Next →</button></div><div class="card"><div class="stats"><div class="stat"><div class="eyebrow">Calories eaten</div><div class="big">'+c.toLocaleString()+'</div><div class="sub">'+(g?g.toLocaleString()+' goal · '+(g-c).toLocaleString()+' remaining':'')+'</div></div><div class="stat"><div class="eyebrow">Macros</div><div class="big">'+Math.round(p)+'g P</div><div class="sub">C '+Math.round(car)+'g · F '+Math.round(fat)+'g</div></div><div class="stat"><div class="eyebrow">Active burn</div><div class="burn">'+(burn(selected)?burn(selected).toLocaleString():'—')+' kcal</div><div class="sub">'+(burn(selected)?'Apple Watch synced Active Energy':'No watch sync recorded')+'</div></div></div></div><div class="grid"><section class="card"><h2 class="section-title">Macro breakdown</h2><p class="section-sub">Calories by macro for this day.</p><div class="donut-wrap"><div class="donut" style="background:conic-gradient(var(--blue) 0 '+pa+'%,#ef9b35 '+pa+'% '+pb+'%,#48a868 '+pb+'% 100%)"></div><div class="legend"><div><i class="dot"></i>Protein: '+Math.round(p)+'g</div><div><i class="dot carb"></i>Carbs: '+Math.round(car)+'g</div><div><i class="dot fat"></i>Fat: '+Math.round(fat)+'g</div></div></div></section><section class="card"><h2 class="section-title">Workout</h2><p class="section-sub">Recorded exercises for this day.</p>'+workoutHtml(selected)+'</section></div><section class="card"><h2 class="section-title">Food entries · '+fmt(selected)+'</h2><p class="section-sub">Grouped by meal. Unclassified items go to Snacks.</p>'+ (food || '<div class="empty">No food entries recorded for this day.</div>') +'</section>'}
function period(mode){const ds=days(mode==='month'?30:7),vals=ds.map(d=>cal(d)),burns=ds.map(d=>burn(d));const mx=Math.max(1,...vals,...burns,D.settings.daily_calorie_goal||0);return '<div class="summary"><div class="card"><div class="eyebrow">Avg intake</div><div class="value">'+avg(vals).toLocaleString()+' kcal</div></div><div class="card"><div class="eyebrow">Avg active burn</div><div class="value">'+avg(burns).toLocaleString()+' kcal</div></div><div class="card"><div class="eyebrow">Days recorded</div><div class="value">'+ds.filter(d=>cal(d)||burn(d)).length+'</div></div><div class="card"><div class="eyebrow">Net average</div><div class="value">'+(avg(vals)-avg(burns)).toLocaleString()+' kcal</div></div></div><section class="card"><h2 class="section-title">'+(mode==='month'?'Month':'Week')+' view</h2><p class="section-sub">Blue = calories eaten · purple = Apple Watch Active Energy. Select a day to open its full record.</p><div class="chart-wrap"><div class="chart '+(mode==='month'?'month':'')+'">'+ds.map(d=>'<div class="col" onclick="selected=\''+d+'\';show(\'dashboard\')"><div class="bars"><div class="bar" style="height:'+cal(d)/mx*100+'%"></div><div class="bar burn" style="height:'+burn(d)/mx*100+'%"></div></div><div class="xlabel">'+new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'numeric',day:'numeric'})+'</div></div>').join('')+'</div></div></section><section class="card"><h2 class="section-title">Recorded days</h2>'+ds.filter(d=>cal(d)||burn(d)).reverse().map(d=>'<div class="history-row" onclick="selected=\''+d+'\';show(\'dashboard\')"><span><b>'+fmt(d)+'</b><br><span class="muted">'+cal(d).toLocaleString()+' eaten · '+(burn(d)||'—')+' active burn · '+macroCells(d)+'</span></span><span>Open →</span></div>').join('')+'</section>'}
function exercise(){return '<section class="card"><h2 class="section-title">Exercise library</h2><p class="section-sub">Your reusable routines and completed workout calendar.</p><nav class="subtabs"><button class="subtab active" data-ex="routines">Routines</button><button class="subtab" data-ex="calendar">Workout calendar</button></nav><div id="exercise-ref"></div></section>'}
function routinesHtml(){const a=D.routines||[];return a.length?'<div class="exercise-grid">'+a.map(x=>'<article class="routine-card"><div class="kind">'+esc(x.kind||'exercise')+'</div><h3>'+esc(x.name||'')+'</h3><div class="macro-line">'+esc(x.notes||'')+'</div></article>').join('')+'</div>':'<div class="empty">No saved routines yet.</div>'}
function historyHtml(){const base=new Date(selected+'T12:00:00'),y=base.getFullYear(),m=base.getMonth(),first=new Date(y,m,1),daysIn=new Date(y,m+1,0).getDate(),start=(first.getDay()+6)%7,labels=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];let cells=labels.map(x=>'<div class="cal-head">'+x+'</div>').join('');for(let i=0;i<start;i++)cells+='<div class="cal-day muted-day"></div>';for(let n=1;n<=daysIn;n++){const d=y+'-'+String(m+1).padStart(2,'0')+'-'+String(n).padStart(2,'0'),ws=(D.workout_entries||[]).filter(x=>x.date===d);cells+='<div class="cal-day" onclick="selected=\''+d+'\';show(\'dashboard\')"><div class="num">'+n+'</div>'+(ws.length?'<div class="cal-workout">'+ws.map(x=>esc(x.routine||'Workout')).join('<br>')+'</div>':'')+'</div>'}return '<div class="calendar">'+cells+'</div>'}
function bindExercise(){document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-ex]').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderExerciseRef(b.dataset.ex)});renderExerciseRef('routines')}
function food(){const sub='<nav class="subtabs"><button class="subtab active" data-ref="food_items">Foods</button><button class="subtab" data-ref="recipes">Recipes</button><button class="subtab" data-ref="meals">Meals</button></nav><div id="refs"></div>';setTimeout(()=>{document.querySelectorAll('.subtab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.subtab').forEach(x=>x.classList.remove('active'));b.classList.add('active');refs(b.dataset.ref)});refs('food_items')},0);return '<section class="card"><h2 class="section-title">Food reference library</h2><p class="section-sub">Foods are ingredients/products. Recipes are prepared dishes. Meals are repeatable combinations.</p>'+sub+'</section>'}
function refs(kind){const a=D[kind]||[];$('#refs').innerHTML=a.length?'<table><thead><tr><th>Name</th><th>Serving</th><th class="num">Calories</th><th class="num">Protein</th><th class="num">Carbs</th><th class="num">Fat</th></tr></thead><tbody>'+a.map(x=>{const unit=x.unit||'serving',c=x.calories_per_unit??x.calories??0,p=x.protein_g_per_unit??x.protein_g??0;return '<tr><td><strong>'+esc(x.name)+'</strong><br><span class="macro-line">'+esc(x.notes||'')+'</span></td><td>'+esc(unit)+'</td><td class="num">'+Math.round(c)+'</td><td class="num">'+Math.round(p)+'g</td><td class="num">'+(x.carbs_g_per_unit??x.carbs_g??'—')+(x.carbs_g_per_unit!=null||x.carbs_g!=null?'g':'')+'</td><td class="num">'+(x.fat_g_per_unit??x.fat_g??'—')+(x.fat_g_per_unit!=null||x.fat_g!=null?'g':'')+'</td></tr>'}).join('')+'</tbody></table>':'<div class="empty">No saved '+kind.replace('_',' ')+' yet.</div>'}
function move(n){const d=new Date(selected+'T12:00:00');d.setDate(d.getDate()+n);selected=d.toISOString().slice(0,10);render()}function show(t){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));$('#'+t).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));if(t==='food')food();if(t==='exercise'){$('#exercise').innerHTML=exercise();bindExercise()}}function render(){$('#today').textContent=fmt(today);$('#dashboard').innerHTML=dashboard();$('#week').innerHTML=period('week');$('#month').innerHTML=period('month')}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.tab));fetch('data.json?live='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(x=>{D=Object.assign({settings:{},food_entries:[],daily_active_calories:[],food_items:[],recipes:[],meals:[]},x);render()}).catch(()=>{$('#dashboard').innerHTML='<section class="card"><h2>Tracker data unavailable</h2><p class="muted">Reload in a moment.</p></section>'});
</script></body></html>
