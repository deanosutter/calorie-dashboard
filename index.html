<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calorie & Workout Tracker</title>
<style>
:root{--ink:#161616;--muted:#6b6b68;--line:#e5e5e0;--paper:#fff;--blue:#2878d4;--purple:#9253c9;--green:#138a45}*{box-sizing:border-box}body{margin:0;background:#f7f7f4;color:var(--ink);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:940px;margin:auto;padding:28px 20px 60px}header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px}h1{font-size:20px;margin:0;font-weight:650}.date-label{color:var(--muted)}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:20px}.tab{border:0;background:none;padding:10px 0;color:var(--muted);font:inherit;cursor:pointer;border-bottom:2px solid transparent}.tab.active{color:var(--blue);border-color:var(--blue)}.panel{display:none}.panel.active{display:block}.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}.daybar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.daybar button{border:1px solid var(--line);background:white;border-radius:7px;padding:7px 11px;cursor:pointer}.daybar input{border:1px solid var(--line);border-radius:7px;padding:7px 10px;font:inherit}.eyebrow{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.big{font-size:34px;font-weight:650;line-height:1.1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.stat{border-right:1px solid var(--line);padding-right:12px}.stat:last-child{border:0}.sub{color:var(--muted);font-size:12px;margin-top:3px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.section-title{font-size:15px;font-weight:650;margin:0 0 3px}.section-sub{color:var(--muted);font-size:12px;margin-bottom:14px}.donut-wrap{display:flex;align-items:center;gap:24px;min-height:170px}.donut{width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--blue) 0 20%,#d8d8d2 20% 100%);position:relative}.donut:after{content:'';position:absolute;inset:38px;background:white;border-radius:50%}.legend{font-size:13px;line-height:2}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--blue)}.dot.other{background:#d8d8d2}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--muted);font-size:12px;font-weight:500;padding:7px 6px;border-bottom:1px solid var(--line)}td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}td.num,th.num{text-align:right;white-space:nowrap}.empty{color:var(--muted);padding:18px 0}.burn{font-size:28px;font-weight:650;color:var(--purple)}.watch{color:var(--muted);font-size:12px}.workout{border:1px solid var(--line);border-radius:9px;padding:13px;margin-top:12px}.workout h3{font-size:14px;margin:0 0 4px}.note{color:#444;line-height:1.5;font-size:13px}.history-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}.history-row:hover{background:#fafaf8}.pill{font-size:12px;color:var(--muted)}.chart{height:240px;display:flex;align-items:flex-end;gap:8px;border-bottom:1px solid var(--line);padding:0 4px}.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}.bars{height:190px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}.bar{width:14px;max-width:35%;background:var(--blue);border-radius:4px 4px 0 0}.bar.burn{background:var(--purple)}.xlabel{font-size:11px;color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stat{border:0}.wrap{padding:20px 12px}.donut-wrap{gap:14px}}
</style></head><body><main class="wrap" id="app"></main>
<script>
const D={"schema_version":3,"settings":{"daily_calorie_goal":1500,"daily_protein_goal_g":170,"timezone":"America/Chicago","last_watch_sync":null},"food_items":[{"id":"extra-large-egg","name":"Extra-large egg","match_phrases":["extra large egg","extra-large egg","large egg","egg"],"unit":"egg","calories_per_unit":80,"protein_g_per_unit":6.8,"notes":"","created":"2026-08-10"},{"id":"breakfast-sausage","name":"Breakfast sausage","match_phrases":["breakfast sausage","sausage"],"unit":"lb","calories_per_unit":1200,"protein_g_per_unit":60,"notes":"","created":"2026-08-10"},{"id":"plain-nonfat-greek-yogurt","name":"Plain nonfat Greek yogurt","match_phrases":["plain nonfat greek yogurt","nonfat greek yogurt","greek yogurt"],"unit":"cup","calories_per_unit":140,"protein_g_per_unit":24,"notes":"","created":"2026-08-10"},{"id":"shredded-cheese","name":"Shredded cheese","match_phrases":["shredded cheese","cheese"],"unit":"cup","calories_per_unit":440,"protein_g_per_unit":28,"notes":"","created":"2026-08-10"},{"id":"frozen-bell-peppers","name":"Frozen bell peppers","match_phrases":["frozen bell peppers","bell peppers"],"unit":"cup","calories_per_unit":40,"protein_g_per_unit":1.33,"notes":"","created":"2026-08-10"},{"id":"pickled-jalapenos","name":"Pickled jalapenos","match_phrases":["pickled jalapenos","jalapenos"],"unit":"tbsp","calories_per_unit":3.33,"protein_g_per_unit":0,"notes":"","created":"2026-08-10"},{"id":"fresh-garlic","name":"Fresh garlic","match_phrases":["fresh garlic","garlic","garlic clove"],"unit":"clove","calories_per_unit":5,"protein_g_per_unit":0.17,"notes":"","created":"2026-08-10"},{"id":"butter","name":"Butter","match_phrases":["butter"],"unit":"tsp","calories_per_unit":34,"protein_g_per_unit":0,"notes":"","created":"2026-08-10"},{"id":"tj-teeny-tiny-avocado","name":"Trader Joe's Teeny Tiny Avocado","match_phrases":["teeny tiny avocado","tiny avocado","trader joe's tiny avocado","trader joes tiny avocado"],"unit":"avocado","calories_per_unit":120,"protein_g_per_unit":1.5,"notes":"~11g fat, ~6g carbs, ~5g fiber per whole avocado. Fractional amounts (e.g. 'half a tiny avocado') scale linearly: half = 60 cal / 0.75g protein.","created":"2026-08-10"},{"id":"great-value-mountain-trail-mix","name":"Great Value Mountain Trail Mix","match_phrases":["mountain trail mix"],"unit":"1/4 cup","calories_per_unit":140,"protein_g_per_unit":4,"notes":"Nutrition label: 140 calories and 4g protein per 1/4 cup (30g).","created":"2026-08-10"},{"id":"great-value-nut-honey-trail-mix","name":"Great Value Nut & Honey Trail Mix","match_phrases":["nut and honey trail mix","nut & honey trail mix"],"unit":"1/4 cup","calories_per_unit":180,"protein_g_per_unit":5,"notes":"Nutrition label: 180 calories and 5g protein per 1/4 cup (32g).","created":"2026-08-10"},{"id":"extra-virgin-olive-oil","name":"Extra-virgin olive oil","match_phrases":["extra virgin olive oil","olive oil"],"unit":"cup","calories_per_unit":1920,"protein_g_per_unit":0,"notes":"Estimated 120 calories per tablespoon.","created":"2026-08-10"},{"id":"banana-medium","name":"Medium banana","match_phrases":["medium banana","banana"],"unit":"banana","calories_per_unit":105,"protein_g_per_unit":1.3,"notes":"","created":"2026-08-10"},{"id":"blueberries","name":"Blueberries","match_phrases":["blueberries"],"unit":"cup","calories_per_unit":84,"protein_g_per_unit":1.1,"notes":"","created":"2026-08-10"},{"id":"popcorn-kernels","name":"Popcorn kernels","match_phrases":["popcorn kernels","popcorn"],"unit":"1/4 cup","calories_per_unit":180,"protein_g_per_unit":5.5,"notes":"","created":"2026-08-10"}],"recipes":[{"id":"sausage-egg-casserole","name":"Sausage Egg Casserole","match_phrases":["sausage egg casserole","egg casserole","egg casserole square","sausage egg casserole square","square of egg casserole","square of the egg casserole","casserole square"],"unit":"square","yield_qty":16,"ingredients":[{"food_item_id":"extra-large-egg","qty":10,"unit":"egg"},{"food_item_id":"breakfast-sausage","qty":1,"unit":"lb"},{"food_item_id":"plain-nonfat-greek-yogurt","qty":0.5,"unit":"cup"},{"food_item_id":"shredded-cheese","qty":0.75,"unit":"cup"},{"food_item_id":"frozen-bell-peppers","qty":1.5,"unit":"cup"},{"food_item_id":"pickled-jalapenos","qty":3,"unit":"tbsp"},{"food_item_id":"fresh-garlic","qty":3,"unit":"clove"},{"food_item_id":"butter","qty":0.5,"unit":"tsp"}],"calories_per_unit":156,"protein_g_per_unit":10.2,"notes":"Whole casserole ~2,502 cal / ~163.5g protein total, cut into 16 equal squares. Per square also ~11-12g fat, ~2g carbs. If Deano mentions any deviation when logging (fewer/more squares, an omitted or swapped ingredient, a half batch, etc.), recompute from the ingredients list above (looking up each food_item's calories/protein per unit) instead of using the cached per-unit numbers, then log the recomputed total. Only overwrite ingredients/calories_per_unit here if he says the change is permanent to the recipe itself.","created":"2026-08-10"},{"id":"ultimate-homemade-granola","name":"Ultimate Homemade Granola","match_phrases":["homemade granola","ultimate homemade granola"],"unit":"cup","yield_qty":6,"ingredients":[],"calories_per_unit":467,"protein_g_per_unit":0,"notes":"User-provided recipe. Approximate batch total 2,800 calories; approximately 230-235 calories per 1/2 cup. Ingredients: 3 cups rolled oats; 1/2 cup almonds; 3 tbsp chia seeds; 2 tbsp ground flaxseed; 1/4 cup unsweetened coconut; 3/4 tsp salt; 1 1/2 tsp cinnamon; 1/2 tsp ginger; 1/4 tsp pumpkin pie spice; pinch nutmeg; 1/2 cup natural peanut butter; 1/3 cup honey; 2 tsp vanilla extract.","created":"2026-08-10"}],"food_entries":[{"date":"2026-08-10","time":"08:00","item":"Cold brew coffee with 1/3 cup almond milk and cinnamon","quantity":1,"unit":"serving","calories":15,"protein_g":0.3,"source":"estimated"},{"date":"2026-08-10","time":"08:00","item":"Celsius Wild Berry energy drink","quantity":1,"unit":"can","calories":10,"protein_g":0,"source":"estimated"},{"date":"2026-08-10","time":"12:00","item":"Mixed Great Value trail mixes (equal parts Mountain and Nut & Honey)","quantity":0.5,"unit":"cup","calories":320,"protein_g":9,"source":"label"},{"date":"2026-08-10","time":"12:00","item":"Sausage Egg Casserole with 1 tiny avocado","quantity":1,"unit":"serving","calories":585,"protein_g":33,"source":"saved meal"},{"date":"2026-08-10","time":"12:00","item":"Parfait: medium banana, 1/2 cup homemade granola, 1 cup nonfat Greek yogurt, 1/2 cup blueberries","quantity":1,"unit":"serving","calories":519,"protein_g":26.9,"source":"mixed_saved_and_estimated"},{"date":"2026-08-10","time":"12:00","item":"Homemade popcorn from 1/4 cup kernels cooked in 1/8 cup extra-virgin olive oil","quantity":1,"unit":"serving","calories":420,"protein_g":5.5,"source":"mixed_saved_and_estimated"}],"routines":[],"workout_entries":[{"date":"2026-08-11","time":"08:00","routine":"HIIT treadmill","duration":"~40 min","source":"Apple Watch + user detail","notes":"3 run intervals: 7.0 mph × 2 min each; 3 incline intervals: 3.4 mph at 15% × 4 min each; 2 min warm-up walk, cooldown, and walking between intervals. Heart-rate pattern: runs typically >150 bpm; incline builds to ~120–130 bpm. Watch active energy is recorded separately as the day's total."}],"weight_entries":[{"date":"2026-08-09","weight":189,"unit":"lb","source":"reported","notes":"Approximate, from phone/scale sync as of the day before this was logged."}],"meals":[{"id":"egg-casserole-lunch","name":"Egg casserole for lunch (standard)","match_phrases":["egg casserole for lunch","standard egg casserole lunch"],"components":[{"ref":"recipe","id":"sausage-egg-casserole","qty":3,"unit":"square"},{"ref":"food_item","id":"tj-teeny-tiny-avocado","qty":1,"unit":"avocado"}],"calories":585,"protein_g":33,"notes":"3 casserole squares + 1 tiny avocado. ~46g fat, ~12g carbs, ~5-6g fiber. If Deano says this lunch deviated (e.g. '2 squares instead of 3', 'no avocado today'), recompute from the components above rather than using this cached total, and log the recomputed version instead — don't silently overwrite this saved meal unless he says to update it.","created":"2026-08-10"}],"daily_active_calories":[{"date":"2026-08-11","calories":708,"source":"Apple Watch synced Active Energy","synced_at":"2026-08-11"}]};
const today=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
let selected=today;
const $=s=>document.querySelector(s), esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};
const foodDate=d=>D.food_entries.filter(x=>x.date===d);
const cal=d=>foodDate(d).reduce((a,x)=>a+Number(x.calories||0),0);
const protein=d=>foodDate(d).reduce((a,x)=>a+Number(x.protein_g||0),0);
const burn=d=>(D.daily_active_calories||[]).find(x=>x.date===d)?.calories||0;
const workouts=d=>D.workout_entries.filter(x=>x.date===d);
const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});
function dayView(){const c=cal(selected),p=protein(selected),g=D.settings.daily_calorie_goal||0,pg=D.settings.daily_protein_goal_g||0, entries=foodDate(selected),ws=workouts(selected),bc=burn(selected);const pct=c?Math.min(100,Math.round((p*4/c)*100)):0;
return `<div class="daybar"><button onclick="move(-1)">← Previous</button><div><div class="eyebrow">Selected day</div><input type="date" value="${selected}" onchange="selected=this.value;render()"></div><button onclick="move(1)">Next →</button></div>
<div class="card"><div class="stats"><div class="stat"><div class="eyebrow">Calories eaten</div><div class="big">${c.toLocaleString()}</div><div class="sub">${g?g.toLocaleString()+' goal · '+(g-c).toLocaleString()+' remaining':''}</div></div><div class="stat"><div class="eyebrow">Protein</div><div class="big">${Math.round(p)}g</div><div class="sub">${pg?pg+'g goal':''}</div></div><div class="stat"><div class="eyebrow">Active burn</div><div class="burn">${bc?bc.toLocaleString():'—'} kcal</div><div class="watch">${bc?'Apple Watch synced Active Energy':'No watch sync recorded for this day'}</div></div></div></div>
<div class="grid"><section class="card"><h2 class="section-title">Macro breakdown</h2><p class="section-sub">${pct}% of logged calories are represented by protein; remaining macros are not yet stored by the logger.</p><div class="donut-wrap"><div class="donut" style="background:conic-gradient(var(--blue) 0 ${pct}%,#d8d8d2 ${pct}% 100%)"></div><div class="legend"><div><i class="dot"></i>Protein calories: ${Math.round(p*4).toLocaleString()}</div><div><i class="dot other"></i>Other calories: ${Math.max(0,c-Math.round(p*4)).toLocaleString()}</div></div></div></section>
<section class="card"><h2 class="section-title">Workout</h2><p class="section-sub">Watch burn is the daily total. Workout detail is recorded separately.</p>${ws.length?ws.map(w=>`<div class="workout"><h3>${esc(w.routine||w.activity||'Workout')} <span class="pill">${esc(w.duration||'')}</span></h3><div class="note">${esc(w.notes||'No segment notes recorded.')}</div></div>`).join(''):'<div class="empty">No workout recorded for this day.</div>'}</section></div>
<section class="card"><h2 class="section-title">Food entries · ${fmt(selected)}</h2><p class="section-sub">Every item recorded for the selected day.</p>${entries.length?`<table><thead><tr><th>Time</th><th>Item</th><th>Qty</th><th class="num">Calories</th><th class="num">Protein</th></tr></thead><tbody>${entries.map(e=>`<tr><td>${esc(e.time||'')}</td><td>${esc(e.item)}</td><td>${esc((e.quantity??'')+' '+(e.unit||''))}</td><td class="num">${Math.round(e.calories||0)}</td><td class="num">${e.protein_g!=null?Math.round(e.protein_g)+'g':'—'}</td></tr>`).join('')}</tbody></table>`: '<div class="empty">No food entries recorded for this day.</div>'}</section>`;}
function progress(){let ds=[];for(let i=13;i>=0;i--){const d=new Date(today+'T12:00:00');d.setDate(d.getDate()-i);const s=d.toISOString().slice(0,10);ds.push(s)}const mx=Math.max(1,...ds.map(d=>Math.max(cal(d),burn(d))),D.settings.daily_calorie_goal||0);return `<section class="card"><h2 class="section-title">14-day intake and active burn</h2><p class="section-sub">Blue = calories eaten · purple = Apple Watch Active Energy. Click a day to open its record.</p><div class="chart">${ds.map(d=>`<div class="col" onclick="selected='${d}';show('dashboard')"><div class="bars"><div class="bar" style="height:${cal(d)/mx*100}%"></div><div class="bar burn" style="height:${burn(d)/mx*100}%"></div></div><div class="xlabel">${new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'numeric',day:'numeric'})}</div></div>`).join('')}</div></section><section class="card"><h2 class="section-title">Recorded days</h2>${ds.filter(d=>cal(d)||burn(d)||workouts(d).length).reverse().map(d=>`<div class="history-row" onclick="selected='${d}';show('dashboard')"><span><b>${fmt(d)}</b><br><span class="pill">${cal(d).toLocaleString()} eaten · ${burn(d).toLocaleString()||'—'} active burn</span></span><span>Open →</span></div>`).join('')||'<div class="empty">No recorded days in this window.</div>'}</section>`;}
function move(n){const d=new Date(selected+'T12:00:00');d.setDate(d.getDate()+n);selected=d.toISOString().slice(0,10);render()}
function show(tab){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.querySelector('#'+tab).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));}
function render(){document.querySelector('#dashboard').innerHTML=dayView();document.querySelector('#progress').innerHTML=progress();document.querySelector('#today').textContent=fmt(today)}
document.querySelector('#app').innerHTML='<header><h1>Calorie & Workout Tracker</h1><span class="date-label" id="today"></span></header><nav class="tabs"><button class="tab active" data-tab="dashboard">Dashboard</button><button class="tab" data-tab="progress">Progress</button></nav><div id="dashboard" class="panel active"></div><div id="progress" class="panel"></div>';document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.tab));render();
</script></body></html>
