<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calorie & Workout Tracker</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-1:       #2a78d6;
    --series-1-wash:  rgba(42,120,214,0.10);
    --series-2:       #a25ddc;
    --status-good:    #0ca30c;
    --status-critical:#d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page-plane:     #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --series-1:       #3987e5;
      --series-1-wash:  rgba(57,135,229,0.14);
      --series-2:       #bb86e8;
      --status-good:    #0ca30c;
      --status-critical:#e66767;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--page-plane); color: var(--text-primary); }
  .wrap { max-width: 900px; margin: 0 auto; padding: 28px 20px 60px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; gap: 6px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  .date-label { color: var(--text-secondary); font-size: 14px; }
  .refresh-hint { color: var(--text-muted); font-size: 12px; margin-bottom: 16px; }

  .tab-row { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
  .tab-btn {
    font: inherit; font-size: 14px; font-weight: 500; padding: 10px 16px; cursor: pointer;
    border: none; background: transparent; color: var(--text-muted); border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab-btn:hover { color: var(--text-primary); }
  .tab-btn.active { color: var(--series-1); border-bottom-color: var(--series-1); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; position: relative; }
  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; }
  .stat-tile { display: flex; flex-direction: column; gap: 4px; }
  .stat-label { font-size: 13px; color: var(--text-secondary); }
  .stat-value { font-size: 32px; font-weight: 600; font-variant-numeric: proportional-nums; color: var(--text-primary); }
  .stat-sub { font-size: 12px; color: var(--text-muted); }
  .stat-sub.good { color: var(--status-good); }
  .stat-sub.critical { color: var(--status-critical); }
  .section-title { font-size: 14px; font-weight: 600; color: var(--text-primary); margin: 0 0 4px 0; }
  .section-sub { font-size: 12px; color: var(--text-muted); margin: 0 0 14px 0; }

  .filter-row { display: flex; gap: 6px; margin-bottom: 16px; }
  .filter-btn {
    font: inherit; font-size: 13px; padding: 6px 14px; border-radius: 999px;
    border: 1px solid var(--border); background: transparent; color: var(--text-secondary);
    cursor: pointer;
  }
  .filter-btn:hover { background: var(--series-1-wash); }
  .filter-btn.active { background: var(--series-1); color: #ffffff; border-color: var(--series-1); }

  .chart-empty { display: flex; align-items: center; justify-content: center; height: 200px; color: var(--text-muted); font-size: 13px; text-align: center; line-height: 1.5; }

  .bars { display: flex; align-items: flex-end; gap: 8px; height: 200px; padding-top: 10px; border-top: 1px solid var(--gridline); position: relative; }
  .goal-line { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--text-muted); }
  .goal-line span { position: absolute; right: 0; top: -18px; font-size: 11px; color: var(--text-muted); background: var(--surface-1); padding-left: 4px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; min-width: 8px; }
  .chart-legend { display:flex; gap:18px; font-size:12px; color:var(--text-secondary); margin:0 0 8px; }
  .legend-swatch { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; }
  .intake-swatch { background:var(--series-1); } .burn-swatch { background:var(--series-2); }
  .combo-chart { height:230px; position:relative; border-top:1px solid var(--gridline); padding-top:10px; }
  .combo-bars, .burn-points { position:absolute; inset:10px 0 24px; display:flex; align-items:flex-end; gap:8px; z-index:1; }
  .combo-bars .bar-col { height:100%; } .dual-bars { display:flex; align-items:flex-end; justify-content:center; gap:3px; height:100%; width:100%; }
  .dual-bars .bar { width:16px; max-width:18px; } .intake-bar { background:var(--series-1); } .burn-bar { background:var(--series-2); opacity:.85; }
  .combo-chart svg { position:absolute; inset:10px 0 24px; width:100%; height:calc(100% - 34px); z-index:2; pointer-events:none; }
  .burn-points { z-index:3; pointer-events:none; } .burn-point { position:absolute; width:12px; height:12px; margin-left:-6px; margin-top:-6px; border-radius:50%; background:var(--series-2); border:2px solid var(--surface-1); pointer-events:auto; }
  .burn-point .tip { bottom:100%; left:50%; transform:translateX(-50%); margin-bottom:6px; } .burn-point:hover .tip { opacity:1; }
  .day-detail { margin-top:18px; } .day-empty-note { margin-top:14px; }
  .bar { width: 22px; max-width: 24px; border-radius: 4px 4px 0 0; background: var(--series-1); position: relative; cursor: default; }
  .bar.over { background: var(--status-critical); }
  .bar-day { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
  .bar .tip, .pt .tip {
    position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
    background: var(--text-primary); color: var(--surface-1); font-size: 11px;
    padding: 3px 7px; border-radius: 5px; white-space: nowrap; margin-bottom: 6px;
    opacity: 0; pointer-events: none; transition: opacity .1s; font-variant-numeric: tabular-nums;
  }
  .bar:hover .tip, .pt:hover .tip { opacity: 1; }

  .linechart { position: relative; height: 200px; border-top: 1px solid var(--gridline); padding-top: 10px; }
  .linechart.small { height: 120px; }
  .linechart svg { width: 100%; height: 100%; overflow: visible; }
  .pt { position: absolute; width: 24px; height: 24px; margin-left: -12px; margin-top: -12px; cursor: default; }
  .pt::after { content: ''; position: absolute; left: 8px; top: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--series-1); border: 2px solid var(--surface-1); }
  .pt.s2::after { background: var(--series-2); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 500; color: var(--text-muted); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--gridline); }
  td { padding: 8px 8px; border-bottom: 1px solid var(--gridline); font-variant-numeric: tabular-nums; color: var(--text-primary); }
  .empty-row td { color: var(--text-muted); font-variant-numeric: normal; }
  .cmd-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  code { background: color-mix(in srgb, var(--text-muted) 14%, transparent); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .load-state { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 14px; }

  .exercise-card { margin-bottom: 20px; }
  .exercise-name { font-size: 15px; font-weight: 600; margin: 0 0 2px 0; }
  .exercise-latest { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
  .note-list { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .note-list li { padding: 8px 0; border-bottom: 1px solid var(--gridline); }
  .note-list li:last-child { border-bottom: none; }
  .note-date { color: var(--text-muted); font-size: 12px; margin-right: 8px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="viz-root">
    <div class="wrap" id="app">
      <div class="load-state" id="load-state">Loading your data&hellip;</div>
    </div>
  </div>

<script>
const TEMPLATE = `
      <header>
        <h1>Calorie &amp; Workout Tracker</h1>
        <span class="date-label" id="today-label"></span>
      </header>
      <div class="refresh-hint">Refresh this page any time to see your latest logged entries.</div>

      <div class="tab-row">
        <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
        <button class="tab-btn" data-tab="progress">Progress</button>
        <button class="tab-btn" data-tab="library">Library</button>
      </div>

      <div class="tab-panel active" id="tab-dashboard">
        <div class="card">
          <div class="stat-row" id="stat-row"></div>
        </div>

        <div class="card">
          <div class="section-title">Calories eaten</div>
          <div class="section-sub" id="chart-sub">Last 7 days</div>
          <div class="filter-row">
            <button class="filter-btn active" data-view="day">Day</button>
            <button class="filter-btn" data-view="week">Week</button>
            <button class="filter-btn" data-view="month">Month</button>
          </div>
          <div id="chart-slot"></div>
        </div>

        <div class="card">
          <div class="section-title">Recent food entries</div>
          <table><thead><tr><th>Date</th><th>Item</th><th>Qty</th><th>Calories</th><th>Protein</th></tr></thead>
            <tbody id="food-table"><tr class="empty-row"><td colspan="5">No food entries yet.</td></tr></tbody>
          </table>
        </div>

        <div class="card">
          <div class="section-title">Recent workouts</div>
          <table><thead><tr><th>Date</th><th>Routine</th><th>Duration</th><th>Cal burned</th><th>Notes</th></tr></thead>
            <tbody id="workout-table"><tr class="empty-row"><td colspan="5">No workouts logged yet.</td></tr></tbody>
          </table>
        </div>
        <div class="cmd-hint">Try: <code>log food: two squares of the lasagna</code> &middot; <code>did push day</code> &middot; <code>show my dashboard</code></div>
      </div>

      <div class="tab-panel" id="tab-progress">
        <div id="progress-slot"></div>
      </div>

      <div class="tab-panel" id="tab-library">
        <div class="card">
          <div class="section-title">Food Items</div>
          <div class="section-sub">Atomic single foods (an egg, garlic, a specific product) — the building blocks recipes and meals are made from.</div>
          <table><thead><tr><th>Name</th><th>Unit</th><th>Per unit</th></tr></thead>
            <tbody id="fooditem-table"><tr class="empty-row"><td colspan="3">No food items saved yet.</td></tr></tbody>
          </table>
        </div>

        <div class="card">
          <div class="section-title">Recipes</div>
          <div class="section-sub">Dishes made by combining food items. Claude uses these to recompute on the fly when you mention a change (fewer squares, a swapped or omitted ingredient, a half batch, etc.).</div>
          <table><thead><tr><th>Name</th><th>Made of</th><th>Per unit</th></tr></thead>
            <tbody id="recipe-table"><tr class="empty-row"><td colspan="3">No recipes saved yet — they get added automatically the first time you log something and confirm you want it remembered.</td></tr></tbody>
          </table>
        </div>

        <div class="card">
          <div class="section-title">Meals</div>
          <div class="section-sub">Quick-log shortcuts built from one or more recipes and/or food items. Claude uses the cached total unless you mention a change, in which case it recomputes from the components.</div>
          <table><thead><tr><th>Name</th><th>Made of</th><th>Calories</th><th>Protein</th></tr></thead>
            <tbody id="meal-table"><tr class="empty-row"><td colspan="4">No meals saved yet.</td></tr></tbody>
          </table>
        </div>

        <div class="card">
          <div class="section-title">Routines</div>
          <div class="section-sub">Exercises and/or supersets — reference only. Claude uses these automatically when you say things like "did push day."</div>
          <table><thead><tr><th>Name</th><th>Exercises</th></tr></thead>
            <tbody id="routine-table"><tr class="empty-row"><td colspan="2">No routines saved yet.</td></tr></tbody>
          </table>
        </div>
      </div>
`;

function fmtDate(d) { return d.toISOString().slice(0,10); }
function parseDate(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function shortDay(d) { return d.toLocaleDateString(undefined, { weekday: 'short' }); }
function shortDate(d) { return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); }
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

let DATA = null;
let today, todayStr, goal, proteinGoal;
const caloriesByDate = {}, proteinByDate = {};

function rangeDates(days) {
  const out = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    out.push(d);
  }
  return out;
}

function renderStats() {
  const todayCal = caloriesByDate[todayStr] || 0;
  const todayProtein = proteinByDate[todayStr] || 0;
  const weekDates = rangeDates(7).map(fmtDate);
  const workoutsThisWeek = DATA.workout_entries.filter(w => weekDates.includes(w.date)).length;

  let goalHtml = '<span class="stat-value">—</span><span class="stat-sub">Say "set my daily calorie goal to X"</span>';
  if (goal) {
    const diff = goal - todayCal;
    const cls = diff >= 0 ? 'good' : 'critical';
    const msg = diff >= 0 ? `${diff} cal remaining` : `${Math.abs(diff)} cal over`;
    goalHtml = `<span class="stat-value">${goal.toLocaleString()}</span><span class="stat-sub ${cls}">${msg}</span>`;
  }

  let proteinGoalHtml = '<span class="stat-value">—</span><span class="stat-sub">Say "set my protein goal to X"</span>';
  if (proteinGoal) {
    const diff = proteinGoal - todayProtein;
    const cls = diff <= 0 ? 'good' : (todayProtein > 0 ? '' : 'critical');
    const msg = diff > 0 ? `${diff}g to go` : 'Goal met';
    proteinGoalHtml = `<span class="stat-value">${proteinGoal}g</span><span class="stat-sub ${cls}">${msg}</span>`;
  }

  document.getElementById('stat-row').innerHTML = `
    <div class="stat-tile">
      <span class="stat-label">Calories today</span>
      <span class="stat-value">${todayCal.toLocaleString()}</span>
      <span class="stat-sub">${DATA.food_entries.length ? DATA.food_entries.filter(e=>e.date===todayStr).length + ' entries logged' : 'No entries logged yet'}</span>
    </div>
    <div class="stat-tile">
      <span class="stat-label">Calorie goal</span>
      ${goalHtml}
    </div>
    <div class="stat-tile">
      <span class="stat-label">Protein today</span>
      <span class="stat-value">${todayProtein}g</span>
      <span class="stat-sub">${todayProtein ? 'Logged today' : 'No protein logged yet'}</span>
    </div>
    <div class="stat-tile">
      <span class="stat-label">Protein goal</span>
      ${proteinGoalHtml}
    </div>
    <div class="stat-tile">
      <span class="stat-label">Workouts this week</span>
      <span class="stat-value">${workoutsThisWeek}</span>
      <span class="stat-sub">${workoutsThisWeek ? 'Logged this week' : 'No workouts logged yet'}</span>
    </div>
    <div class="stat-tile">
      <span class="stat-label">Weight</span>
      ${weightStatHtml()}
    </div>
  `;
}

function weightStatHtml() {
  const entries = DATA.weight_entries || [];
  if (!entries.length) {
    return '<span class="stat-value">—</span><span class="stat-sub">Say "log weight 189"</span>';
  }
  const sorted = [...entries].sort((a,b) => a.date.localeCompare(b.date));
  const latest = sorted[sorted.length - 1];
  let sub = shortDate(parseDate(latest.date));
  if (sorted.length > 1) {
    const prev = sorted[sorted.length - 2];
    const diff = latest.weight - prev.weight;
    if (diff !== 0) sub += ` &middot; ${diff > 0 ? '+' : ''}${diff}${latest.unit} vs last`;
  }
  return `<span class="stat-value">${latest.weight}${latest.unit}</span><span class="stat-sub">${sub}</span>`;
}

function maxWithGoal(values) {
  const m = Math.max(1, ...values, goal || 0);
  return m * 1.15;
}

function caloriesBurnedForDate(dateStr) {
  return DATA.workout_entries.filter(w => w.date === dateStr).reduce((sum, w) => sum + Number(w.calories_burned ?? w.cal_burned ?? w.active_calories ?? w.activeCalories ?? 0), 0);
}

function renderDayView() {
  const dates = rangeDates(7);
  const entries = DATA.food_entries.filter(e => e.date === todayStr);
  document.getElementById('chart-sub').textContent = 'Last 7 days — intake bars and burn line';
  const values = dates.map(d => caloriesByDate[fmtDate(d)] || 0);
  const burned = dates.map(d => caloriesBurnedForDate(fmtDate(d)));
  const max = Math.max(1, ...values, ...burned, goal || 0) * 1.15;
  const bars = dates.map((d,i) => '<div class="bar-col"><div class="dual-bars"><div class="bar intake-bar" style="height:' + Math.round(values[i]/max*100) + '%"><span class="tip">' + shortDate(d) + ': ' + values[i].toLocaleString() + ' cal eaten</span></div><div class="bar burn-bar" style="height:' + Math.round(burned[i]/max*100) + '%"><span class="tip">' + shortDate(d) + ': ' + burned[i].toLocaleString() + ' cal burned</span></div></div><span class="bar-day">' + shortDay(d) + '</span></div>').join('');
  const W = 600, H = 180, step = W / Math.max(1, dates.length - 1);
  const points = burned.map((v,i) => [i*step, H - (v/max)*H]);
  const path = points.map((p,i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const dots = points.map((p,i) => '<div class="burn-point" style="left:' + (p[0]/W*100) + '%;top:' + (p[1]/H*100) + '%"><span class="tip">' + shortDate(dates[i]) + ': ' + burned[i].toLocaleString() + ' cal burned</span></div>').join('');
  const goalPct = goal ? Math.min(100, goal/max*100) : null;
  const rows = entries.map(e => '<tr><td>' + (e.time || '') + '</td><td>' + escapeHtml(e.item) + '</td><td>' + (e.quantity || '') + ' ' + escapeHtml(e.unit || '') + '</td><td>' + Math.round(e.calories) + '</td><td>' + (e.protein_g != null ? Math.round(e.protein_g) + 'g' : '—') + '</td></tr>').join('');
  document.getElementById('chart-slot').innerHTML = '<div class="chart-legend"><span><i class="legend-swatch intake-swatch"></i>Calories eaten</span><span><i class="legend-swatch burn-swatch"></i>Calories burned</span></div><div class="combo-chart">' + (goalPct !== null ? '<div class="goal-line" style="bottom:' + goalPct + '%"><span>Goal ' + goal.toLocaleString() + '</span></div>' : '') + '<div class="combo-bars">' + bars + '</div><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none"><path d="' + path + '" fill="none" stroke="var(--series-2)" stroke-width="2" vector-effect="non-scaling-stroke" /></svg><div class="burn-points">' + dots + '</div></div>' + (entries.length ? '<div class="day-detail"><div class="section-sub">Today\'s entries</div><table><thead><tr><th>Time</th><th>Item</th><th>Qty</th><th>Calories</th><th>Protein</th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '<div class="section-sub day-empty-note">Nothing logged today yet.</div>');
}
function renderWeekView() {
  const dates = rangeDates(7);
  const values = dates.map(d => caloriesByDate[fmtDate(d)] || 0);
  document.getElementById('chart-sub').textContent = 'Last 7 days';
  const slot = document.getElementById('chart-slot');
  if (!DATA.food_entries.length) {
    slot.innerHTML = '<div class="chart-empty">Nothing logged yet.<br>Say &ldquo;log food&rdquo; to add your first entry.</div>';
    return;
  }
  const max = maxWithGoal(values);
  const goalPct = goal ? Math.min(100, (goal / max) * 100) : null;
  let bars = dates.map((d, i) => {
    const v = values[i];
    const h = Math.round((v / max) * 100);
    const over = goal && v > goal;
    return `<div class="bar-col">
      <div class="bar ${over ? 'over' : ''}" style="height:${h}%"><span class="tip">${shortDate(d)}: ${v.toLocaleString()} cal</span></div>
      <span class="bar-day">${shortDay(d)}</span>
    </div>`;
  }).join('');
  slot.innerHTML = `<div class="bars">
    ${goalPct !== null ? `<div class="goal-line" style="bottom:${goalPct}%"><span>Goal ${goal.toLocaleString()}</span></div>` : ''}
    ${bars}
  </div>`;
}

function renderMonthView() {
  const dates = rangeDates(30);
  const values = dates.map(d => caloriesByDate[fmtDate(d)] || 0);
  document.getElementById('chart-sub').textContent = 'Last 30 days';
  const slot = document.getElementById('chart-slot');
  if (!DATA.food_entries.length) {
    slot.innerHTML = '<div class="chart-empty">Nothing logged yet.<br>Say &ldquo;log food&rdquo; to add your first entry.</div>';
    return;
  }
  const max = maxWithGoal(values);
  const W = 600, H = 180;
  const stepX = W / (values.length - 1);
  const pts = values.map((v, i) => [i * stepX, H - (v / max) * H]);
  const path = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const goalY = goal ? H - Math.min(1, goal / max) * H : null;
  let dots = pts.map((p, i) => {
    const pct = (p[0] / W) * 100, topPct = (p[1] / H) * 100;
    return `<div class="pt" style="left:${pct}%; top:${topPct}%"><span class="tip">${shortDate(dates[i])}: ${values[i].toLocaleString()} cal</span></div>`;
  }).join('');
  slot.innerHTML = `<div class="linechart">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      ${goalY !== null ? `<line x1="0" y1="${goalY}" x2="${W}" y2="${goalY}" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="4 4" />` : ''}
      <path d="${path}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
    </svg>
    ${dots}
  </div>`;
}

const renderers = { day: renderDayView, week: renderWeekView, month: renderMonthView };
function setView(view) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  renderers[view]();
}

function setTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + tab));
}

function renderTables() {
  const foodBody = document.getElementById('food-table');
  if (DATA.food_entries.length) {
    const rows = [...DATA.food_entries].sort((a,b) => (b.date+b.time).localeCompare(a.date+a.time)).slice(0, 10);
    foodBody.innerHTML = rows.map(e => `<tr><td>${e.date}</td><td>${escapeHtml(e.item)}</td><td>${e.quantity || ''} ${escapeHtml(e.unit || '')}</td><td>${Math.round(e.calories)}</td><td>${e.protein_g != null ? Math.round(e.protein_g) + 'g' : '—'}</td></tr>`).join('');
  }

  const workoutBody = document.getElementById('workout-table');
  if (DATA.workout_entries.length) {
    const rows = [...DATA.workout_entries].sort((a,b) => (b.date+(b.time||'')).localeCompare(a.date+(a.time||''))).slice(0, 10);
    workoutBody.innerHTML = rows.map(w => `<tr><td>${w.date}</td><td>${escapeHtml(w.routine_name || 'One-off')}</td><td>${w.duration_min ? w.duration_min + ' min' : '—'}</td><td>${w.calories_burned || '—'}</td><td>${escapeHtml(w.notes || '—')}</td></tr>`).join('');
  }

  const recipeById = {};
  (DATA.recipes || []).forEach(r => { recipeById[r.id] = r; });
  const foodItemById = {};
  (DATA.food_items || []).forEach(f => { foodItemById[f.id] = f; });

  const fooditemBody = document.getElementById('fooditem-table');
  if ((DATA.food_items || []).length) {
    fooditemBody.innerHTML = DATA.food_items.map(f => {
      const perUnit = `${f.calories_per_unit} cal${f.protein_g_per_unit != null ? ' / ' + f.protein_g_per_unit + 'g' : ''} per ${escapeHtml(f.unit)}`;
      return `<tr><td>${escapeHtml(f.name)}</td><td>${escapeHtml(f.unit)}</td><td>${perUnit}</td></tr>`;
    }).join('');
  }

  const recipeBody = document.getElementById('recipe-table');
  if ((DATA.recipes || []).length) {
    recipeBody.innerHTML = DATA.recipes.map(r => {
      const ingredients = (r.ingredients || []).map(i => {
        const f = foodItemById[i.food_item_id];
        return `${i.qty} ${escapeHtml(i.unit)} ${escapeHtml(f ? f.name : i.food_item_id)}`;
      }).join('<br>');
      const perUnit = `${r.calories_per_unit} cal${r.protein_g_per_unit != null ? ' / ' + r.protein_g_per_unit + 'g' : ''} per ${escapeHtml(r.unit)}`;
      return `<tr><td>${escapeHtml(r.name)}</td><td>${ingredients || '—'}</td><td>${perUnit}</td></tr>`;
    }).join('');
  }

  const mealBody = document.getElementById('meal-table');
  if ((DATA.meals || []).length) {
    mealBody.innerHTML = DATA.meals.map(m => {
      const made = (m.components || []).map(c => {
        const ref = c.ref === 'food_item' ? foodItemById[c.id] : recipeById[c.id];
        return `${c.qty} ${escapeHtml(c.unit)} ${escapeHtml(ref ? ref.name : c.id)}`;
      }).join(' + ');
      return `<tr><td>${escapeHtml(m.name)}</td><td>${made || '—'}</td><td>${Math.round(m.calories)}</td><td>${m.protein_g != null ? Math.round(m.protein_g) + 'g' : '—'}</td></tr>`;
    }).join('');
  }

  const routineBody = document.getElementById('routine-table');
  if (DATA.routines.length) {
    routineBody.innerHTML = DATA.routines.map(r => `<tr><td>${escapeHtml(r.name)}</td><td>${r.exercises.map(e => escapeHtml(e.name)).join(', ')}</td></tr>`).join('');
  }
}

// --- Progress tab: body weight trend, per-exercise weight history, chronological notes ---
function renderBodyWeight() {
  const entries = [...(DATA.weight_entries || [])].sort((a,b) => a.date.localeCompare(b.date));
  if (!entries.length) {
    return `<div class="card"><div class="section-title">Body weight</div><div class="chart-empty">No weight logged yet.<br>Say &ldquo;log weight 189&rdquo; any time — weekly is plenty.</div></div>`;
  }
  const latest = entries[entries.length - 1];
  const first = entries[0];
  const delta = latest.weight - first.weight;
  const deltaMsg = entries.length > 1
    ? (delta === 0 ? 'Holding steady' : `${delta > 0 ? '+' : ''}${delta}${latest.unit} since ${shortDate(parseDate(first.date))}`)
    : 'Only one entry so far';

  let chart = '';
  if (entries.length > 1) {
    const values = entries.map(e => e.weight);
    const max = Math.max(...values) * 1.02;
    const min = Math.min(...values) * 0.98;
    const W = 600, H = 100;
    const stepX = W / (entries.length - 1);
    const pts = values.map((v, i) => [i * stepX, H - ((v - min) / (max - min || 1)) * H]);
    const path = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    const dots = pts.map((p, i) => {
      const pct = (p[0] / W) * 100, topPct = (p[1] / H) * 100;
      const e = entries[i];
      return `<div class="pt" style="left:${pct}%; top:${topPct}%"><span class="tip">${shortDate(parseDate(e.date))}: ${e.weight}${e.unit}</span></div>`;
    }).join('');
    chart = `<div class="linechart small">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <path d="${path}" fill="none" stroke="var(--series-2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
      </svg>
      ${dots.replace(/class="pt"/g, 'class="pt s2"')}
    </div>`;
  }

  const tableRows = [...entries].reverse().slice(0, 15).map(e =>
    `<tr><td>${e.date}</td><td>${e.weight}${e.unit}</td><td>${escapeHtml(e.notes || '—')}</td></tr>`
  ).join('');
  const table = `<table><thead><tr><th>Date</th><th>Weight</th><th>Notes</th></tr></thead><tbody>${tableRows}</tbody></table>`;

  return `<div class="card">
    <div class="section-title">Body weight</div>
    <div class="exercise-latest">Latest: ${latest.weight}${latest.unit} on ${shortDate(parseDate(latest.date))} &middot; ${deltaMsg}</div>
    ${chart}
    ${table}
  </div>`;
}

function renderProgress() {
  const slot = document.getElementById('progress-slot');
  const bodyWeightHtml = renderBodyWeight();
  const entries = [...DATA.workout_entries].sort((a,b) => (a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));

  if (!entries.length) {
    slot.innerHTML = bodyWeightHtml + '<div class="card"><div class="chart-empty">No workouts logged yet.<br>Once you log a few, weight trends and notes will show up here.</div></div>';
    return;
  }

  // Group per-exercise weight history across all logged workouts
  const byExercise = {};
  entries.forEach(w => {
    (w.exercises || []).forEach(ex => {
      if (ex.weight == null) return;
      if (!byExercise[ex.name]) byExercise[ex.name] = [];
      byExercise[ex.name].push({ date: w.date, weight: Number(ex.weight), unit: ex.unit || '', reps: ex.reps, sets: ex.sets });
    });
  });

  let exerciseHtml = Object.keys(byExercise).sort().map(name => {
    const hist = byExercise[name];
    const latest = hist[hist.length - 1];
    const first = hist[0];
    const delta = latest.weight - first.weight;
    const deltaMsg = hist.length > 1
      ? (delta === 0 ? 'Holding steady' : (delta > 0 ? `Up ${delta}${latest.unit} since ${shortDate(parseDate(first.date))}` : `Down ${Math.abs(delta)}${latest.unit} since ${shortDate(parseDate(first.date))}`))
      : 'Only one session logged so far';

    let chart = '';
    if (hist.length > 1) {
      const values = hist.map(h => h.weight);
      const max = Math.max(...values) * 1.1;
      const min = Math.min(0, Math.min(...values) * 0.9);
      const W = 600, H = 100;
      const stepX = hist.length > 1 ? W / (hist.length - 1) : 0;
      const pts = values.map((v, i) => [i * stepX, H - ((v - min) / (max - min || 1)) * H]);
      const path = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
      const dots = pts.map((p, i) => {
        const pct = (p[0] / W) * 100, topPct = (p[1] / H) * 100;
        const h = hist[i];
        return `<div class="pt" style="left:${pct}%; top:${topPct}%"><span class="tip">${shortDate(parseDate(h.date))}: ${h.weight}${h.unit}${h.reps ? ' x' + h.reps : ''}</span></div>`;
      }).join('');
      chart = `<div class="linechart small">
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
          <path d="${path}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
        </svg>
        ${dots}
      </div>`;
    }

    const tableRows = [...hist].reverse().slice(0, 15).map(h =>
      `<tr><td>${h.date}</td><td>${h.sets || '—'}</td><td>${h.reps || '—'}</td><td>${h.weight}${h.unit}</td></tr>`
    ).join('');
    const table = `<table><thead><tr><th>Date</th><th>Sets</th><th>Reps</th><th>Weight</th></tr></thead><tbody>${tableRows}</tbody></table>`;

    return `<div class="card exercise-card">
      <div class="exercise-name">${escapeHtml(name)}</div>
      <div class="exercise-latest">Latest: ${latest.weight}${latest.unit}${latest.reps ? ' x ' + latest.reps : ''}${latest.sets ? ', ' + latest.sets + ' sets' : ''} on ${shortDate(parseDate(latest.date))} &middot; ${deltaMsg}</div>
      ${chart}
      ${table}
    </div>`;
  }).join('');

  // Chronological notes feed (fatigue, form comments, deviations, anything logged in .notes)
  const notesEntries = [...entries].reverse().filter(w => w.notes && w.notes.trim());
  const notesHtml = notesEntries.length
    ? `<div class="card"><div class="section-title">Notes over time</div><ul class="note-list">${notesEntries.map(w => `<li><span class="note-date">${w.date}</span>${escapeHtml(w.notes)}</li>`).join('')}</ul></div>`
    : `<div class="card"><div class="section-title">Notes over time</div><div class="section-sub">Nothing logged yet. Mention how a workout felt — soreness, fatigue, form issues — and it'll show up here.</div></div>`;

  slot.innerHTML = bodyWeightHtml + (exerciseHtml || '<div class="card"><div class="chart-empty">No weighted exercises logged yet.</div></div>') + notesHtml;
}

async function boot() {
  try {
    const res = await fetch('./data.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    DATA = await res.json();
  } catch (err) {
    document.getElementById('app').innerHTML = '<div class="load-state">Couldn’t load data.json (' + escapeHtml(err.message) + '). Refresh to retry.</div>';
    return;
  }

  document.getElementById('app').innerHTML = TEMPLATE;

  today = new Date();
  today.setHours(0,0,0,0);
  todayStr = fmtDate(today);
  document.getElementById('today-label').textContent = today.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  goal = DATA.settings.daily_calorie_goal;
  proteinGoal = DATA.settings.daily_protein_goal_g;

  DATA.food_entries.forEach(e => {
    caloriesByDate[e.date] = (caloriesByDate[e.date] || 0) + Number(e.calories || 0);
    if (e.protein_g != null) proteinByDate[e.date] = (proteinByDate[e.date] || 0) + Number(e.protein_g || 0);
  });

  renderStats();
  renderTables();
  renderProgress();
  setView('day');

  document.querySelectorAll('.filter-btn').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
  document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
}

boot();
</script>
